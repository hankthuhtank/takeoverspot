name: TAKEOVER Final Canvas Integrity
on:
  push:
    branches: [main]
    paths: ['tools/final_canvas_integrity.py']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python tools/final_canvas_integrity.py
      - run: node --check takeover-v3.js
      - name: Commit integrity fixes
        run: |
          git config user.name "TAKEOVER Builder"
          git config user.email "actions@users.noreply.github.com"
          git add takeover-v3.js
          git commit -m "Preserve anonymous canvas assets and remove center special case"
          git push
