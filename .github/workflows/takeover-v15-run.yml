name: TAKEOVER V15 Runner
'on':
  push:
    branches: [main]
    paths: ['.github/workflows/takeover-v15-run.yml']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Execute V15 patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('.github/workflows/takeover-v15-final-readability.yml').read_text()
          a=s.index('      - name: Apply final visual fixes')
          a=s.index('        run: |',a)+len('        run: |\n')
          b=s.index('      - name: Verify',a)
          lines=[]
          for line in s[a:b].splitlines():
              lines.append(line[10:] if line.startswith('          ') else line)
          Path('/tmp/v15.sh').write_text('\n'.join(lines)+'\n')
          PY
          bash /tmp/v15.sh
      - name: Verify V15
        run: |
          node --check boot.js
          node --check takeover-v3.js
          grep -q 'TAKEOVER V15' takeover-v3.css
          grep -q 'object-fit:contain' takeover-v3.css
          grep -q 'admin-top h2{font-size:44px' takeover-v3.css
          grep -q 'takeover-v3.css?v=15' boot.js
          grep -q 'takeover-v3.js?v=15' boot.js
          grep -q 'boot.js?v=11' index.html
      - name: Commit V15
        run: |
          git config user.name "TAKEOVER Builder"
          git config user.email "actions@users.noreply.github.com"
          git add takeover-v3.css boot.js index.html
          git commit -m "Fix logo fit and enlarge owner console"
          git push
