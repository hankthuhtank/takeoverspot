name: TAKEOVER Rich Creative Upgrade
on:
  push:
    branches: [main]
    paths: ['.github/workflows/rich-creative-upgrade.yml']
permissions:
  contents: read
jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch creative frontend
        run: |
          python scripts/rich_upgrade.py
          python scripts/rich_fix.py
      - name: Syntax check
        run: node --check takeover-v2.js
      - name: Multi-spot smoke test
        run: |
          npm init -y >/dev/null 2>&1
          npm install jsdom@25 --no-save >/dev/null 2>&1
          node scripts/rich_smoke.cjs
      - name: Package patched files
        uses: actions/upload-artifact@v4
        with:
          name: takeover-rich-creative-patch
          path: |
            takeover-v2.js
            takeover.css