name: TAKEOVER Canvas Overhaul Fix
on:
  push:
    branches: [main]
    paths: ['tools/fix_canvas_output.py']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python tools/apply_canvas_overhaul.py
      - run: python tools/fix_canvas_output.py
      - run: node --check takeover-v3.js
      - name: Commit product overhaul
        run: |
          git config user.name "TAKEOVER Builder"
          git config user.email "actions@users.noreply.github.com"
          git add index.html takeover-v3.js takeover-v3.css boot.js
          git commit -m "Overhaul TAKEOVER canvas and simplify rules"
          git push
