name: TAKEOVER V14 Support Security
'on':
  push:
    branches: [main]
    paths: ['.github/workflows/takeover-v14-support-security.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add support console and browser hardening
        run: |
          python - <<'PY'
          from pathlib import Path

          csp='<meta http-equiv="Content-Security-Policy" content="default-src \'self\'; script-src \'self\' https://cdn.jsdelivr.net; style-src \'self\' \'unsafe-inline\' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src \'self\' data: blob: https://xvfgiaxxvwdnmzzdfboc.supabase.co; connect-src \'self\' https://xvfgiaxxvwdnmzzdfboc.supabase.co wss://xvfgiaxxvwdnmzzdfboc.supabase.co; object-src \'none\'; base-uri \'self\'; form-action \'self\'; upgrade-insecure-requests">\n<meta name="referrer" content="strict-origin-when-cross-origin">'

          p=Path('index.html'); h=p.read_text()
          if 'Content-Security-Policy' not in h:
              h=h.replace('<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">','<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">\n'+csp,1)
          h=h.replace('<button class="admin-tab" data-admin-tab="accounts">ACCOUNTS</button>','<button class="admin-tab" data-admin-tab="accounts">ACCOUNTS</button>\n      <button class="admin-tab" data-admin-tab="support">SUPPORT</button>',1)
          accounts='''      <section class="admin-pane" data-admin-pane="accounts">
        <div class="admin-block"><div class="admin-block-head admin-search-head"><div><b>ACCOUNTS</b><span>Search customers and see ownership/purchase history.</span></div><input id="adminAccountSearch" type="search" placeholder="Search email or company"></div><div id="adminAccounts"><div class="empty">Loading accounts…</div></div></div>
      </section>'''
          support='''      <section class="admin-pane" data-admin-pane="support">
        <div class="admin-block"><div class="admin-block-head"><div><b>SUPPORT INBOX</b><span>Private messages submitted through the public contact form.</span></div></div><div id="adminSupport"><div class="empty">Loading support requests…</div></div></div>
      </section>'''
          if accounts not in h: raise SystemExit('accounts pane marker missing')
          h=h.replace(accounts,accounts+'\n\n'+support,1)
          h=h.replace('boot.js?v=9','boot.js?v=10')
          p.write_text(h)

          p=Path('takeover-v3.js'); s=p.read_text()
          old="const titles={dashboard:'Dashboard',board:'Live board',purchases:'Purchases',accounts:'Accounts',storage:'Storage',security:'Security',settings:'Settings',moderation:'Moderation / audit'};"
          new="const titles={dashboard:'Dashboard',board:'Live board',purchases:'Purchases',accounts:'Accounts',support:'Support',storage:'Storage',security:'Security',settings:'Settings',moderation:'Moderation / audit'};"
          if old not in s: raise SystemExit('admin titles marker missing')
          s=s.replace(old,new,1)
          s=s.replace("if(name==='accounts')renderAdminAccounts();if(name==='storage')renderAdminStorage();","if(name==='accounts')renderAdminAccounts();if(name==='support')renderAdminSupport();if(name==='storage')renderAdminStorage();",1)
          marker="function renderAdminStorageData(st){"
          support_fn=r'''async function renderAdminSupport(){const box=$('#adminSupport');if(!box)return;box.innerHTML='<div class="empty">Loading support requests…</div>';try{const {data,error}=await sb.from('support_requests').select('id,name,email,subject,message,status,created_at').order('created_at',{ascending:false}).limit(100);if(error)throw error;const rows=data||[];box.innerHTML=rows.length?rows.map(r=>`<div class="support-row ${r.status==='new'?'unread':''}"><div class="support-head"><div><b>${esc(r.subject)}</b><span>${esc(r.name)} · ${esc(r.email)}</span><small>${new Date(r.created_at).toLocaleString()}</small></div><span class="support-status">${esc(String(r.status||'new').toUpperCase())}</span></div><p>${esc(r.message)}</p>${r.status==='new'?`<button class="tiny" data-support-resolve="${r.id}">MARK RESOLVED</button>`:''}</div>`).join(''):'<div class="empty">No support requests.</div>';$$('[data-support-resolve]').forEach(b=>b.onclick=async()=>{b.disabled=true;const {error}=await sb.from('support_requests').update({status:'resolved'}).eq('id',b.dataset.supportResolve);if(error){toast(error.message);b.disabled=false;return}toast('Support request resolved');renderAdminSupport()})}catch(e){box.innerHTML=`<div class="empty">${esc(e.message)}</div>`}}
'''
          if marker not in s: raise SystemExit('admin storage marker missing')
          s=s.replace(marker,support_fn+marker,1)
          p.write_text(s)

          p=Path('takeover-v3.css'); css=p.read_text()
          css += '''\n/* TAKEOVER V14 — owner support inbox */\n.support-row{padding:14px 0;border-bottom:1px solid #e5e5df}.support-row:last-child{border-bottom:0}.support-row.unread{border-left:3px solid #111;padding-left:11px}.support-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}.support-head b{font-size:13px}.support-head span:not(.support-status){display:block;margin-top:3px;font-size:9px;color:#555}.support-head small{display:block;margin-top:3px;color:#888;font-size:8px}.support-status{flex:0 0 auto;border:1px solid #d5d5ce;border-radius:999px;padding:5px 7px;font:800 7px 'DM Mono',monospace}.support-row p{white-space:pre-wrap;font-size:11px;line-height:1.55;color:#444;margin:10px 0}\n'''
          p.write_text(css)

          p=Path('boot.js'); b=p.read_text().replace('takeover-v3.css?v=13','takeover-v3.css?v=14').replace('takeover-v3.js?v=13','takeover-v3.js?v=14'); p.write_text(b)

          p=Path('contact.js'); j=p.read_text()
          old="const {error}=await sb.from('support_requests').insert(payload);if(error){btn.textContent='TRY AGAIN';btn.disabled=false;alert('Could not send your request. Please try again.');return}"
          new="payload.fax=$('#fax').value;const {data,error}=await sb.functions.invoke('takeover-support',{body:payload});if(error||data?.error){btn.textContent='TRY AGAIN';btn.disabled=false;alert(data?.error||'Could not send your request. Please try again.');return}"
          if old not in j: raise SystemExit('contact insert marker missing')
          j=j.replace(old,new,1);p.write_text(j)

          p=Path('contact.html'); ch=p.read_text()
          if 'Content-Security-Policy' not in ch:
              ch=ch.replace('<meta name="viewport" content="width=device-width,initial-scale=1">','<meta name="viewport" content="width=device-width,initial-scale=1">'+csp,1)
          ch=ch.replace('contact.js?v=1','contact.js?v=2')
          p.write_text(ch)
          PY
      - name: Verify V14
        run: |
          node --check takeover-v3.js
          node --check contact.js
          node --check boot.js
          grep -q 'data-admin-tab="support"' index.html
          grep -q 'id="adminSupport"' index.html
          grep -q 'renderAdminSupport' takeover-v3.js
          grep -q "takeover-support" contact.js
          if grep -q "from('support_requests').insert" contact.js; then exit 1; fi
          grep -q 'Content-Security-Policy' index.html
          grep -q 'Content-Security-Policy' contact.html
          grep -q 'takeover-v3.js?v=14' boot.js
          grep -q 'takeover-v3.css?v=14' boot.js
          grep -q 'boot.js?v=10' index.html
          grep -q 'contact.js?v=2' contact.html
      - name: Commit V14
        run: |
          git config user.name "TAKEOVER Builder"
          git config user.email "actions@users.noreply.github.com"
          git add index.html takeover-v3.js takeover-v3.css boot.js contact.html contact.js
          git commit -m "Add protected support inbox and browser security policy"
          git push
