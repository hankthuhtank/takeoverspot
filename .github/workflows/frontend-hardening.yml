name: TAKEOVER Frontend Hardening
on:
  push:
    branches: [main]
    paths: ['.github/workflows/frontend-hardening.yml']
permissions:
  contents: write
jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch frontend reliability and polling
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('takeover-v2.js')
          s=p.read_text()

          anchor="function connected(arr){if(arr.length<2)return true;const seen=new Set([arr[0]]),q=[arr[0]];while(q.length){const a=q.shift();arr.forEach(b=>{if(!seen.has(b)&&neighbor(a,b)){seen.add(b);q.push(b)}})}return seen.size===arr.length}\n"
          helper="""function connected(arr){if(arr.length<2)return true;const seen=new Set([arr[0]]),q=[arr[0]];while(q.length){const a=q.shift();arr.forEach(b=>{if(!seen.has(b)&&neighbor(a,b)){seen.add(b);q.push(b)}})}return seen.size===arr.length}\nfunction setLogoPreview(boxSelector,inputSelector,url,placeholder){const box=$(boxSelector),input=$(inputSelector);if(!box||!input)return;[...box.children].forEach(el=>{if(el!==input)el.remove()});const el=document.createElement(url?'img':'span');if(url){el.src=url;el.alt='Logo preview'}else el.textContent=placeholder;box.insertBefore(el,input)}\n"""
          if anchor not in s: raise SystemExit('helper anchor missing')
          s=s.replace(anchor,helper,1)

          s=s.replace("boardPoll=setInterval(refreshBoard,2000)","boardPoll=setInterval(refreshBoard,5000)",1)

          old="if(session)updateAlertBadge();else $('#alertBtn').hidden=true}"
          new="if(session)$('#alertBtn').hidden=false;else $('#alertBtn').hidden=true}"
          if old not in s: raise SystemExit('chrome alert block missing')
          s=s.replace(old,new,1)

          old="renderBoard();renderChrome();startLiveUpdates();await handleReturn();"
          new="renderBoard();renderChrome();startLiveUpdates();if(session)await updateAlertBadge();await handleReturn();"
          if old not in s: raise SystemExit('loadState block missing')
          s=s.replace(old,new,1)

          old="function fillBrandForm(){if(profile){$('#companyName').value=profile.company_name||'';$('#companyWebsite').value=profile.website||''}else{$('#companyName').value='';$('#companyWebsite').value=''}$('#logoPreview').innerHTML=selectedLogoUrl?`<img src=\"${esc(selectedLogoUrl)}\" alt=\"Logo\">`:'<span>UPLOAD LOGO · OPTIONAL</span>';$('#logoFile').value=''}"
          new="function fillBrandForm(){if(profile){$('#companyName').value=profile.company_name||'';$('#companyWebsite').value=profile.website||''}else{$('#companyName').value='';$('#companyWebsite').value=''}setLogoPreview('#logoPreview','#logoFile',selectedLogoUrl,'UPLOAD LOGO · OPTIONAL');const input=$('#logoFile');if(input)input.value=''}"
          if old not in s: raise SystemExit('fillBrandForm missing')
          s=s.replace(old,new,1)

          old="$('#logoFile').onchange=e=>{const f=e.target.files?.[0];if(f)$('#logoPreview').innerHTML=`<img src=\"${URL.createObjectURL(f)}\" alt=\"Logo preview\">`};"
          new="$('#logoFile').onchange=e=>{const f=e.target.files?.[0];if(f)setLogoPreview('#logoPreview','#logoFile',URL.createObjectURL(f),'UPLOAD LOGO · OPTIONAL')};"
          if old not in s: raise SystemExit('logo onchange missing')
          s=s.replace(old,new,1)

          old="$('#accountLogoPreview').innerHTML=profile?.logo_url?`<img src=\"${esc(profile.logo_url)}\" alt=\"Logo\">`:'<span>NO LOGO YET</span>';$('#accountLogo').value='';"
          new="setLogoPreview('#accountLogoPreview','#accountLogo',profile?.logo_url||null,'NO LOGO YET');const accountLogo=$('#accountLogo');if(accountLogo)accountLogo.value='';"
          if old not in s: raise SystemExit('account preview missing')
          s=s.replace(old,new,1)

          old="$('#accountLogo').onchange=e=>{const f=e.target.files?.[0];if(f)$('#accountLogoPreview').innerHTML=`<img src=\"${URL.createObjectURL(f)}\" alt=\"Logo preview\">`};"
          new="$('#accountLogo').onchange=e=>{const f=e.target.files?.[0];if(f)setLogoPreview('#accountLogoPreview','#accountLogo',URL.createObjectURL(f),'NO LOGO YET')};"
          if old not in s: raise SystemExit('account onchange missing')
          s=s.replace(old,new,1)

          old="sb.auth.onAuthStateChange((_e,s)=>{setTimeout(async()=>{session=s;await loadIdentity();renderChrome();startLiveUpdates();const d=readDraft();if(session&&d)restoreDraft(d)},0)});"
          new="sb.auth.onAuthStateChange((_e,s)=>{setTimeout(async()=>{session=s;await loadIdentity();renderChrome();startLiveUpdates();if(session)await updateAlertBadge();const d=readDraft();if(session&&d)restoreDraft(d)},0)});"
          if old not in s: raise SystemExit('auth state handler missing')
          s=s.replace(old,new,1)

          old="let lastShield=false;setInterval(()=>{const active=shieldActive();renderChrome();if(lastShield&&!active)renderBoard();lastShield=active},1000);\nloadState().catch(e=>toast(e.message));"
          new="let lastShield=false;setInterval(()=>{const active=shieldActive();renderChrome();if(lastShield&&!active)renderBoard();lastShield=active},1000);\ndocument.addEventListener('visibilitychange',()=>{if(!document.hidden)refreshBoard()});window.addEventListener('focus',refreshBoard);\nloadState().catch(e=>toast(e.message));"
          if old not in s: raise SystemExit('footer block missing')
          s=s.replace(old,new,1)
          p.write_text(s)

          h=Path('index.html')
          x=h.read_text().replace('takeover.css?v=1','takeover.css?v=2').replace('takeover-v2.js?v=2','takeover-v2.js?v=3')
          h.write_text(x)

          c=Path('takeover.css')
          css=c.read_text()
          css=css.replace(".take-pill{pointer-events:auto;position:absolute;right:9px;bottom:9px;", ".take-pill{pointer-events:auto;position:absolute;right:9px;bottom:9px;min-height:34px;min-width:82px;")
          css=css.replace(".take-pill{right:5px;bottom:5px;padding:6px 7px;font-size:7px}", ".take-pill{right:5px;bottom:5px;padding:8px 9px;font-size:8px;min-height:34px;min-width:76px}")
          c.write_text(css)
          PY
      - name: Smoke-test spot clicks
        run: |
          npm init -y >/dev/null 2>&1
          npm install jsdom@25 --no-save >/dev/null 2>&1
          cat > /tmp/smoke.cjs <<'JS'
          const fs=require('fs');
          const {JSDOM}=require('jsdom');
          let html=fs.readFileSync('index.html','utf8').replace(/<script[^>]*src=[^>]*><\/script>/g,'');
          const dom=new JSDOM(html,{url:'https://takeoverspot.com/',runScripts:'outside-only',pretendToBeVisual:true});
          const w=dom.window;
          const board=Array.from({length:12},(_,i)=>({spot_number:i+1,current_price:0,owner_key:null,company_name:null,website:null,logo_url:null,owner_since:null,updated_at:null}));
          const cfg={starting_price:10,min_increment:1,purchases_enabled:true,page_shield_until:null};
          function builder(table){
            const b={select(){return b},eq(){return b},is(){return b},in(){return Promise.resolve({data:[],error:null})},update(){return b},insert(){return Promise.resolve({data:null,error:null})},limit(){return Promise.resolve({data:[],error:null})},order(){return Promise.resolve({data:table==='takeover_spots'?board:[],error:null})},maybeSingle(){return Promise.resolve({data:table==='takeover_config'?cfg:null,error:null})}};
            return b;
          }
          const sb={
            auth:{getSession:()=>Promise.resolve({data:{session:null}}),onAuthStateChange:()=>({data:{subscription:{unsubscribe(){}}}}),signOut:()=>Promise.resolve(),signInWithOtp:()=>Promise.resolve({error:null})},
            from:builder,
            rpc:()=>Promise.resolve({data:false,error:null}),
            channel:()=>({on(){return this},subscribe(){return this}}),removeChannel(){},
            storage:{from:()=>({upload:()=>Promise.resolve({error:null}),getPublicUrl:()=>({data:{publicUrl:'https://example.test/logo.png'}})})},
            functions:{invoke:()=>Promise.resolve({data:{url:'https://stripe.test'},error:null})}
          };
          w.supabase={createClient:()=>sb};
          w.eval(fs.readFileSync('takeover-v2.js','utf8'));
          setTimeout(()=>{
            const intro=w.document.querySelector('#introGotIt'); if(intro) intro.click();
            const cell=w.document.querySelector('.available-cell');
            if(!cell) throw new Error('No clickable empty spot rendered');
            cell.click();
            const modal=w.document.querySelector('#takeoverModal');
            if(!modal.classList.contains('on')) throw new Error('Spot click did not open takeover modal');
            if(!w.document.querySelector('#logoFile')) throw new Error('Takeover logo input was destroyed');
            if(!w.document.querySelector('#companyName')) throw new Error('Takeover form missing');
            console.log('PASS: Spot click opens takeover modal and upload input survives.');
            process.exit(0);
          },150);
          JS
          node /tmp/smoke.cjs
      - name: Commit hardening
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html takeover-v2.js takeover.css
          git commit -m "Fix TAKEOVER spot clicks and harden frontend"
          git push