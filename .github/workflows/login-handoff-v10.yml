name: TAKEOVER Cross Device Login V10
on:
  push:
    branches: [main]
    paths: ['.github/workflows/login-handoff-v10.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add cross-device auth handoff
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('takeover-v3.js')
          s=p.read_text()

          old="let pendingReturnPreview=null;"
          new="let pendingReturnPreview=null;\nlet loginHandoffPoll=null,loginHandoffCompleting=false;\nconst LOGIN_HANDOFF_STORAGE='takeover_login_handoff_v1';"
          if old not in s: raise SystemExit('handoff state marker missing')
          s=s.replace(old,new,1)

          marker="function openAuth(){if(session)return openAccount();$('#authEmail').value='';$('#authSent').hidden=true;openPanel('#authModal')}"
          helpers=r'''function readLoginHandoff(){try{const h=JSON.parse(sessionStorage.getItem(LOGIN_HANDOFF_STORAGE)||'null');if(!h?.id||!h?.secret||!h?.expiresAt||Date.now()>=Number(h.expiresAt)){sessionStorage.removeItem(LOGIN_HANDOFF_STORAGE);return null}return h}catch{return null}}
function clearLoginHandoff(){sessionStorage.removeItem(LOGIN_HANDOFF_STORAGE);if(loginHandoffPoll){clearInterval(loginHandoffPoll);loginHandoffPoll=null}}
async function invokeLoginHandoff(body,accessToken=''){const opts={body};if(accessToken)opts.headers={Authorization:`Bearer ${accessToken}`};const {data,error}=await sb.functions.invoke('takeover-login-handoff',opts);if(error)throw error;return data||{}}
async function createLoginHandoff(email){try{const data=await invokeLoginHandoff({action:'create',email});if(!data?.id||!data?.secret)return null;const h={id:data.id,secret:data.secret,email,expiresAt:new Date(data.expires_at||Date.now()+600000).getTime()};sessionStorage.setItem(LOGIN_HANDOFF_STORAGE,JSON.stringify(h));return h}catch(e){console.error('TAKEOVER login handoff create failed',e);return null}}
async function checkLoginHandoff(){const h=readLoginHandoff();if(!h||session)return clearLoginHandoff();try{const data=await invokeLoginHandoff({action:'claim',id:h.id,secret:h.secret});if(data?.status!=='ready'||!data?.token_hash)return;clearLoginHandoff();const {error}=await sb.auth.verifyOtp({token_hash:data.token_hash,type:'email'});if(error)throw error;invokeLoginHandoff({action:'consume',id:h.id,secret:h.secret}).catch(()=>{});closePanels();toast('Signed in. You can continue here.')}catch(e){if(Date.now()>=Number(h.expiresAt))clearLoginHandoff();else console.debug('TAKEOVER login handoff waiting',e?.message||e)}}
function startStoredLoginHandoffPoll(){if(session||loginHandoffPoll||!readLoginHandoff())return;loginHandoffPoll=setInterval(checkLoginHandoff,1200);checkLoginHandoff()}
function removeHandoffParam(){const u=new URL(location.href);u.searchParams.delete('auth_handoff');history.replaceState({},'',u.pathname+(u.search||''))}
async function completeLoginHandoffFromUrl(){const id=new URLSearchParams(location.search).get('auth_handoff');if(!id||!session?.access_token||loginHandoffCompleting)return;loginHandoffCompleting=true;try{const data=await invokeLoginHandoff({action:'complete',id},session.access_token);if(data?.status==='ready'){removeHandoffParam();toast('Sign-in confirmed. Your other TAKEOVER tab is signing in too.')}}catch(e){console.error('TAKEOVER login handoff complete failed',e);setTimeout(()=>{loginHandoffCompleting=false;completeLoginHandoffFromUrl()},1500);return}loginHandoffCompleting=false}
'''
          if marker not in s: raise SystemExit('openAuth marker missing')
          s=s.replace(marker,helpers+'\n'+marker,1)

          old_send="if($('#sendMagicLink'))$('#sendMagicLink').onclick=async()=>{const email=$('#authEmail').value.trim();if(!email)return toast('Enter your email');const b=$('#sendMagicLink'),old=b.textContent;b.disabled=true;b.textContent='SENDING…';saveDraft();const {error}=await sb.auth.signInWithOtp({email,options:{emailRedirectTo:location.origin+location.pathname,shouldCreateUser:true}});b.disabled=false;b.textContent=old;if(error)return toast(error.message);$('#authSent').hidden=false;$('#authSent').textContent=`Sign-in link sent to ${email}. Open it and you’ll come right back here.`};"
          new_send="if($('#sendMagicLink'))$('#sendMagicLink').onclick=async()=>{const email=$('#authEmail').value.trim();if(!email)return toast('Enter your email');const b=$('#sendMagicLink'),old=b.textContent;b.disabled=true;b.textContent='SENDING…';saveDraft();clearLoginHandoff();const h=await createLoginHandoff(email),redirect=new URL(location.origin+location.pathname);if(h)redirect.searchParams.set('auth_handoff',h.id);const {error}=await sb.auth.signInWithOtp({email,options:{emailRedirectTo:redirect.toString(),shouldCreateUser:true}});b.disabled=false;b.textContent=old;if(error){clearLoginHandoff();return toast(error.message)}$('#authSent').hidden=false;$('#authSent').textContent=h?`Sign-in link sent to ${email}. Open it on any device — this page will sign in automatically.`:`Sign-in link sent to ${email}. Open it to sign in.`;if(h)startStoredLoginHandoffPoll()};"
          if old_send not in s: raise SystemExit('sendMagicLink block missing')
          s=s.replace(old_send,new_send,1)

          old_load="async function loadState(){prepStaticUi();"
          new_load="async function loadState(){const arrivedHandoff=new URLSearchParams(location.search).has('auth_handoff');prepStaticUi();"
          if old_load not in s: raise SystemExit('loadState prefix missing')
          s=s.replace(old_load,new_load,1)

          old_load_mid="if(session)await updateAlertBadge();await handleReturn();const draft=readDraft();"
          new_load_mid="if(session){await updateAlertBadge();await completeLoginHandoffFromUrl()}await handleReturn();startStoredLoginHandoffPoll();const draft=readDraft();"
          if old_load_mid not in s: raise SystemExit('loadState auth section missing')
          s=s.replace(old_load_mid,new_load_mid,1)

          old_intro="if(!localStorage.getItem('takeover_intro_v2')&&!new URLSearchParams(location.search).has('takeover'))openPanel('#introModal')"
          new_intro="if(!localStorage.getItem('takeover_intro_v2')&&!new URLSearchParams(location.search).has('takeover')&&!arrivedHandoff)openPanel('#introModal')"
          if old_intro not in s: raise SystemExit('intro condition missing')
          s=s.replace(old_intro,new_intro,1)

          old_auth="if(session)await updateAlertBadge();const d=readDraft();"
          new_auth="if(session){await updateAlertBadge();await completeLoginHandoffFromUrl()}else startStoredLoginHandoffPoll();const d=readDraft();"
          if old_auth not in s: raise SystemExit('auth state section missing')
          s=s.replace(old_auth,new_auth,1)
          p.write_text(s)

          i=Path('index.html')
          ix=i.read_text()
          old_html='<button class="action" id="sendMagicLink">EMAIL ME A SIGN-IN LINK</button>\n    <div class="success-state" id="authSent" hidden></div>'
          new_html='<button class="action" id="sendMagicLink">EMAIL ME A SIGN-IN LINK</button>\n    <p class="hint">Don’t see the email? Check your Junk or Spam folder.</p>\n    <div class="success-state" id="authSent" hidden></div>'
          if old_html not in ix: raise SystemExit('auth modal HTML marker missing')
          ix=ix.replace(old_html,new_html,1).replace('boot.js?v=5','boot.js?v=6')
          i.write_text(ix)

          b=Path('boot.js')
          bs=b.read_text().replace('takeover-v3.js?v=9','takeover-v3.js?v=10')
          b.write_text(bs)
          PY
      - name: Verify
        run: |
          node --check takeover-v3.js
          node --check boot.js
          grep -q "takeover-login-handoff" takeover-v3.js
          grep -q "auth_handoff" takeover-v3.js
          grep -q "verifyOtp({token_hash" takeover-v3.js
          grep -q "Open it on any device" takeover-v3.js
          grep -q "Junk or Spam" index.html
          grep -q "takeover-v3.js?v=10" boot.js
          grep -q "boot.js?v=6" index.html
      - name: Commit
        run: |
          git config user.name "TAKEOVER Builder"
          git config user.email "actions@users.noreply.github.com"
          git add takeover-v3.js index.html boot.js
          git commit -m "Add cross-device passwordless login handoff"
          git push
