name: TAKEOVER Frontend Smoke Test
'on':
  push:
    branches: [main]
    paths: ['index.html','takeover-v3.js','takeover-v3.css','takeover.css','boot.js','contact.js','contact.html','.github/workflows/ci-v16.yml']
  pull_request:
    paths: ['index.html','takeover-v3.js','takeover-v3.css','takeover.css','boot.js','contact.js','contact.html']
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax
        run: |
          node --check takeover-v3.js
          node --check boot.js
          node --check contact.js
      - name: V16 architecture
        run: |
          grep -q 'const TOTAL=16' takeover-v3.js
          grep -q 'takeover-v3.js?v=16' boot.js
          grep -q 'takeover-v3.css?v=16' boot.js
          grep -q 'boot.js?v=12' index.html
          grep -q 'TAKEOVER V16' takeover-v3.css
          grep -q 'frameCells' takeover-v3.js
          grep -q 'ensureFrameClip' takeover-v3.js
          grep -q 'selectionShape(frame)' takeover-v3.js
          grep -q 'currentCanvas.frameCells=' takeover-v3.js
          grep -q 'startLayerTouch' takeover-v3.js
          grep -q 'touchDistance' takeover-v3.js
          grep -q 'PINCH with two fingers' takeover-v3.js
          grep -q 'BroadcastChannel' takeover-v3.js
          grep -q 'showHandoffReturnScreen' takeover-v3.js
          grep -q 'window.close()' takeover-v3.js
          grep -q 'Math.max(1,Math.trunc' takeover-v3.js
          grep -q "storage_retention_days" takeover-v3.js
          grep -q 'object-fit:contain!important' takeover-v3.css
          grep -q 'data-admin-tab="support"' index.html
          grep -q 'takeover-support' contact.js
          if grep -q 'Logo is too large (2 MB max)' takeover-v3.js; then exit 1; fi
      - name: Dead-pixel contract
        run: |
          node - <<'JS'
          const fs=require('fs');
          const s=fs.readFileSync('takeover-v3.js','utf8');
          const live="canvas.frameCells?.length?[{...selectionShape(frame),cells:nums,clip:ensureFrameClip(nums,frame)}]";
          if(!s.includes(live)) throw Error('Combined creatives no longer anchor to original footprint');
          if(!s.includes("currentCanvas.frameCells=[...new Set(selected.map(Number)")) throw Error('Checkout no longer stores original footprint');
          if(!s.includes("editorContext==='purchase'?nums:(editorCanvas.frameCells?.length?editorCanvas.frameCells:nums)")) throw Error('Editor no longer preserves original footprint');
          console.log('PASS V16 DEAD-PIXEL CONTRACT');
          JS
      - name: One-dollar start regression
        run: |
          node - <<'JS'
          const fs=require('fs');
          const s=fs.readFileSync('takeover-v3.js','utf8');
          if(!s.includes("Math.max(1,Math.trunc(Number($('#startingPrice').value)||10))")) throw Error('Admin starting price no longer permits $1');
          if(!s.includes(".select('starting_price,min_increment,purchases_enabled,page_shield_until,storage_retention_days')")) throw Error('Config load fields changed unexpectedly');
          console.log('PASS V16 $1 CONFIG CONTRACT');
          JS
