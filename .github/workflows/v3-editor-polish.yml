name: One-time V3 editor polish
on:
  push:
    branches: [main]
    paths: ['.github/workflows/v3-editor-polish.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch SPOT CANVAS destination editing
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('takeover-v3.js')
          s=p.read_text()
          old="<aside class=\"canvas-side\"><div class=\"canvas-section\"><h3>BACKGROUND</h3>"
          new="<aside class=\"canvas-side\"><div class=\"canvas-section\"><h3>DESTINATION</h3><div class=\"canvas-row\"><label>NAME</label><input id=\"canvasCompany\" type=\"text\" maxlength=\"80\" placeholder=\"Company name\"></div><div class=\"canvas-row\"><label>WEBSITE</label><input id=\"canvasWebsite\" type=\"text\" maxlength=\"300\" placeholder=\"yourcompany.com\"></div><p class=\"canvas-help\">This label and click-through belong only to this territory.</p></div><div class=\"canvas-section\"><h3>BACKGROUND</h3>"
          if old not in s: raise SystemExit('destination insertion point missing')
          s=s.replace(old,new,1)
          old="document.body.appendChild(p);$('#canvasClose').onclick=closeCanvasEditor;"
          new="document.body.appendChild(p);$('#canvasClose').onclick=closeCanvasEditor;$('#canvasCompany').oninput=e=>editorCompany=e.target.value;$('#canvasWebsite').oninput=e=>editorWebsite=e.target.value;"
          if old not in s: raise SystemExit('canvas handler insertion point missing')
          s=s.replace(old,new,1)
          old="$('#canvasTitle').textContent=context==='purchase'?'Design this territory.':'Edit this territory.';syncDisplayButtons();renderEditor();"
          new="$('#canvasTitle').textContent=context==='purchase'?'Design this territory.':'Edit this territory.';$('#canvasCompany').value=editorCompany;$('#canvasWebsite').value=editorWebsite;syncDisplayButtons();renderEditor();"
          if old not in s: raise SystemExit('canvas value insertion point missing')
          s=s.replace(old,new,1)
          old="async function saveCanvasEditor(){if(editorContext==='purchase'){currentCanvas=JSON.parse(JSON.stringify(editorCanvas));renderPurchaseCanvasPreview();closeCanvasEditor();toast('Design ready for checkout');return}try{const {error}=await sb.rpc('update_takeover_canvas',{p_creative_id:editorCreativeId,p_company_name:editorCompany,p_website:editorWebsite,p_canvas_json:editorCanvas});"
          new="async function saveCanvasEditor(){editorCompany=($('#canvasCompany')?.value||editorCompany).trim();editorWebsite=normalizeWebsite($('#canvasWebsite')?.value||editorWebsite);if(!editorCompany)return toast('Enter a company name');if(!editorWebsite)return toast('Enter a website');if(editorContext==='purchase'){currentCanvas=JSON.parse(JSON.stringify(editorCanvas));$('#companyName').value=editorCompany;$('#companyWebsite').value=editorWebsite;renderPurchaseCanvasPreview();closeCanvasEditor();toast('Design ready for checkout');return}try{const {error}=await sb.rpc('update_takeover_canvas',{p_creative_id:editorCreativeId,p_company_name:editorCompany,p_website:editorWebsite,p_canvas_json:editorCanvas});"
          if old not in s: raise SystemExit('save function insertion point missing')
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
          node --check takeover-v3.js
          git config user.name "TAKEOVER Build"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add takeover-v3.js
          git commit -m "Finish SPOT CANVAS territory editing"
          git push
