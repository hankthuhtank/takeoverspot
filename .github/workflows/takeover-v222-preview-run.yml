name: TAKEOVER V22.2 Preview Apply
'on':
  push:
    branches: [main]
    paths: ['.takeover-v222-preview.py','.github/workflows/takeover-v222-preview-run.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply preview patch
        run: python .takeover-v222-preview.py
      - name: Verify
        run: |
          node --check takeover-v3.js
          node --check boot.js
          grep -q 'toggleCanvasPreview' takeover-v3.js
          grep -q 'editorPreviewMode' takeover-v3.js
          grep -q 'canvas-preview-live' takeover-v3.js
          grep -q 'LIVE PREVIEW · EXACT BOARD RENDER' takeover-v3.js
          grep -q 'TAKEOVER V22.2' takeover-v3.css
          grep -q 'takeover-v3.js?v=22.2' boot.js
          grep -q 'takeover-v3.css?v=22.2' boot.js
      - name: Commit
        run: |
          git config user.name takeover-bot
          git config user.email takeover-bot@users.noreply.github.com
          git add takeover-v3.js takeover-v3.css boot.js
          git commit -m 'TAKEOVER V22.2 add Canvas preview' || exit 0
          git push
