name: Bootstrap TAKEOVER
on:
  push:
    branches: [main]
    paths: ['.github/workflows/bootstrap.yml']
permissions:
  contents: write
jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Import TAKEOVER production frontend
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://raw.githubusercontent.com/hankthuhtank/safi-solutions/main/spot"
          files=(index.html takeover.css takeover-v2.js terms.html privacy.html payments.html content-policy.html contact.html contact.js legal.css)
          for f in "${files[@]}"; do
            curl -fsSL "$BASE/$f" -o "$f"
          done
          python - <<'PY'
          from pathlib import Path
          for name in ['index.html','takeover-v2.js','terms.html','privacy.html','payments.html','content-policy.html','contact.html','contact.js']:
              p=Path(name)
              s=p.read_text()
              s=s.replace('https://safisolutions.org/spot/','https://takeoverspot.com/')
              s=s.replace('https://www.safisolutions.org/spot/','https://takeoverspot.com/')
              p.write_text(s)
          PY
          printf 'takeoverspot.com\n' > CNAME
          cat > README.md <<'EOF'
          # TAKEOVER

          **The webpage belongs to whoever wants it most.**

          Production frontend for [takeoverspot.com](https://takeoverspot.com).

          Backend: dedicated TAKEOVER Supabase project. Payments: Stripe Checkout.
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html takeover.css takeover-v2.js terms.html privacy.html payments.html content-policy.html contact.html contact.js legal.css CNAME README.md
          git commit -m "Import TAKEOVER production site"
          git push