name: TAKEOVER Anonymous Canvas Browser Check
on:
  push:
    branches: [main]
    paths: ['tests/anonymous-canvas.cjs']
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm install playwright@1.55.0 --no-save
      - run: npx playwright install chromium --with-deps
      - run: python3 -m http.server 4173 >/tmp/takeover-http.log 2>&1 &
      - run: node tests/anonymous-canvas.cjs
