name: TAKEOVER V18 Runner
'on':
  push:
    branches: [main]
    paths: ['.github/workflows/takeover-v18-run.yml']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply V18
        run: python .takeover-v18-patch.py
      - name: Verify V18
        run: |
          node --check takeover-v3.js
          node --check boot.js
          grep -q "takeover-v3.js?v=18" boot.js
          grep -q "takeover-v3.css?v=18" boot.js
          grep -q "boot.js?v=14" index.html
          grep -q "shapeStyle" takeover-v3.js
          grep -q "Particle Field" takeover-v3.js
          grep -q "case'gravity'" takeover-v3.js
          grep -q "case'liquid'" takeover-v3.js
          grep -q "case'kinetic'" takeover-v3.js
          grep -q "case'stardust'" takeover-v3.js
          grep -q "editorTouchGesture.os\*scale" takeover-v3.js
          grep -q 'max=\"96\"' takeover-v3.js
          grep -q 'takeoverParticle' takeover-v3.css
          grep -q 'motion-morph' takeover-v3.css
      - name: Commit V18
        run: |
          git config user.name "hankthuhtank"
          git config user.email "safihelal@gmail.com"
          git add takeover-v3.js takeover-v3.css boot.js index.html
          git commit -m "TAKEOVER V18 expressive presets and text scaling"
          git push
