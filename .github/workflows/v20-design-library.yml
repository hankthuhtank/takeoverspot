name: TAKEOVER V20 Design Library
'on':
  push:
    branches: [main]
    paths: ['.github/workflows/v20-design-library.yml']
permissions:
  contents: write
jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply V20 design library upgrade
        run: |
          python - <<'PY'
          from pathlib import Path

          def load(p): return Path(p).read_text()
          def save(p,s): Path(p).write_text(s)
          def rep(s,old,new,label):
              if old not in s:
                  raise SystemExit(f'missing patch target: {label}')
              return s.replace(old,new)

          # INDEX: saved-design library section + clearer private identity copy source + cache bump.
          p='index.html'; s=load(p)
          s=rep(s,'<div id="mySpots"></div>\n    <div class="selector-title"><div><b>ALERTS</b>','<div id="mySpots"></div>\n    <div class="selector-title"><div><b>SAVED DESIGNS</b><small style="display:block;margin-top:5px;line-height:1.45">Keep up to 40 designs in your private library. Saved artwork survives being outbid.</small></div></div>\n    <div id="myDesigns"><div class="empty">No saved designs yet.</div></div>\n    <div class="selector-title"><div><b>ALERTS</b>','account saved designs')
          s=s.replace('<script src="boot.js?v=15"></script>','<script src="boot.js?v=16"></script>')
          save(p,s)

          # MAIN JS
          p='takeover-v3.js'; s=load(p)
          s=rep(s,"let mode='takeover',selected=[],bidLevels={},seedSpot=null,selectedLogoUrl=null,currentCanvas=null,toastTimer=null,boardPoll=null,noticeChannel=null;","let mode='takeover',selected=[],bidLevels={},seedSpot=null,selectedLogoUrl=null,currentCanvas=null,toastTimer=null,boardPoll=null,noticeChannel=null,savedDesigns=[],logoExplicitlyRemoved=false;",'globals')

          # New shape vocabulary.
          s=s.replace("shapeStyle:['rect','blob','ring','star','burst','ribbon','diamond','particles'].includes(l.shapeStyle)?l.shapeStyle:'rect'","shapeStyle:['rect','blob','ring','star','burst','ribbon','diamond','particles','orb','spark','cutout','capsule'].includes(l.shapeStyle)?l.shapeStyle:'rect'")

          # Logo removal control.
          old="function fillBrandForm(){if(profile){$('#companyName').value=profile.company_name||'';$('#companyWebsite').value=profile.website||''}else{$('#companyName').value='';$('#companyWebsite').value=''}selectedLogoUrl=profile?.logo_url||selectedLogoUrl||null;currentCanvas=defaultCanvas($('#companyName').value,selectedLogoUrl);setLogoPreview('#logoPreview','#logoFile',selectedLogoUrl,'CLICK TO CHOOSE LOGO');if($('#logoFile'))$('#logoFile').value='';if($('#purchaseAssent'))$('#purchaseAssent').checked=false;renderPurchaseCanvasPreview()}\nfunction setLogoPreview(boxSelector,inputSelector,url,placeholder){const box=$(boxSelector),input=$(inputSelector);if(!box||!input)return;box.onclick=null;[...box.children].forEach(el=>{if(el!==input)el.remove()});const trigger=document.createElement('label');trigger.className='logo-trigger';trigger.htmlFor=input.id;const src=safeImg(url);if(src){const img=document.createElement('img');img.src=src;img.alt='Logo preview';trigger.appendChild(img)}else{const empty=document.createElement('span');empty.className='logo-empty';empty.textContent=placeholder||'CLICK TO CHOOSE LOGO';trigger.appendChild(empty)}const choose=document.createElement('span');choose.className='logo-choose';choose.textContent=src?'REPLACE LOGO':'CHOOSE LOGO';trigger.appendChild(choose);box.insertBefore(trigger,input)}"
          new="function fillBrandForm(){if(profile){$('#companyName').value=profile.company_name||'';$('#companyWebsite').value=profile.website||''}else{$('#companyName').value='';$('#companyWebsite').value=''}logoExplicitlyRemoved=false;selectedLogoUrl=profile?.logo_url||null;currentCanvas=defaultCanvas($('#companyName').value,selectedLogoUrl);setLogoPreview('#logoPreview','#logoFile',selectedLogoUrl,'CLICK TO CHOOSE LOGO');if($('#logoFile'))$('#logoFile').value='';if($('#purchaseAssent'))$('#purchaseAssent').checked=false;renderPurchaseCanvasPreview()}\nasync function clearPurchaseLogo(){const old=selectedLogoUrl;logoExplicitlyRemoved=true;selectedLogoUrl=null;if($('#logoFile'))$('#logoFile').value='';if(currentCanvas?.layers)currentCanvas.layers=currentCanvas.layers.filter(l=>!(l?.role==='logo'||(old&&l?.role==='logo'&&l?.src===old)));if(profile)profile.logo_url=null;setLogoPreview('#logoPreview','#logoFile',null,'CLICK TO CHOOSE LOGO');renderPurchaseCanvasPreview();if(session)sb.rpc('clear_takeover_profile_logo').catch(e=>console.debug('Could not clear default logo',e?.message||e))}\nfunction setLogoPreview(boxSelector,inputSelector,url,placeholder){const box=$(boxSelector),input=$(inputSelector);if(!box||!input)return;box.onclick=null;[...box.children].forEach(el=>{if(el!==input)el.remove()});const trigger=document.createElement('label');trigger.className='logo-trigger';trigger.htmlFor=input.id;const src=safeImg(url);if(src){const img=document.createElement('img');img.src=src;img.alt='Logo preview';trigger.appendChild(img)}else{const empty=document.createElement('span');empty.className='logo-empty';empty.textContent=placeholder||'CLICK TO CHOOSE LOGO';trigger.appendChild(empty)}const choose=document.createElement('span');choose.className='logo-choose';choose.textContent=src?'REPLACE LOGO':'CHOOSE LOGO';trigger.appendChild(choose);box.insertBefore(trigger,input);if(src&&boxSelector==='#logoPreview'){const remove=document.createElement('button');remove.type='button';remove.className='logo-remove';remove.textContent='REMOVE LOGO';remove.onclick=e=>{e.preventDefault();e.stopPropagation();clearPurchaseLogo()};box.appendChild(remove)}}"
          s=rep(s,old,new,'logo removal')

          s=rep(s,"function renderCheckoutGate(){$('#signinGate').hidden=!!session;$('#checkoutBtn').hidden=!session;$('#signedAs').hidden=!session;if(session)$('#signedAs').textContent=`Buying as ${session.user.email}`}","function renderCheckoutGate(){$('#signinGate').hidden=!!session;$('#checkoutBtn').hidden=!session;$('#signedAs').hidden=!session;if(session)$('#signedAs').innerHTML=`<strong>Buying privately as ${esc(session.user.email)}</strong><br>Your email/account identity is never shown on the board. Use a brand, handle, alias or pseudonym publicly — you can remain anonymous to visitors.`}",'private identity copy')
          s=rep(s,"if($('#logoFile'))$('#logoFile').onchange=async e=>{const f=e.target.files?.[0];if(!f)return;try{if(f.size>IMAGE_STORED_LIMIT)toast('Optimizing image…');selectedLogoUrl=await storeLocalAsset(f);setLogoPreview('#logoPreview','#logoFile',selectedLogoUrl,'CLICK TO CHOOSE LOGO');renderPurchaseCanvasPreview()}catch(err){toast(err.message)}};","if($('#logoFile'))$('#logoFile').onchange=async e=>{const f=e.target.files?.[0];if(!f)return;try{logoExplicitlyRemoved=false;if(f.size>IMAGE_STORED_LIMIT)toast('Optimizing image…');selectedLogoUrl=await storeLocalAsset(f);setLogoPreview('#logoPreview','#logoFile',selectedLogoUrl,'CLICK TO CHOOSE LOGO');renderPurchaseCanvasPreview()}catch(err){toast(err.message)}};",'logo onchange')
          s=rep(s,"async function uploadTakeoverLogo(){const f=$('#logoFile')?.files?.[0];if(f)return uploadSpecific(f,'takeover-logos',IMAGE_STORED_LIMIT);if(String(selectedLogoUrl||'').startsWith(LOCAL_ASSET_PREFIX))return uploadLocalRef(selectedLogoUrl,'takeover-logos',IMAGE_STORED_LIMIT);return selectedLogoUrl||profile?.logo_url||null}","async function uploadTakeoverLogo(){if(logoExplicitlyRemoved)return null;const f=$('#logoFile')?.files?.[0];if(f)return uploadSpecific(f,'takeover-logos',IMAGE_STORED_LIMIT);if(String(selectedLogoUrl||'').startsWith(LOCAL_ASSET_PREFIX))return uploadLocalRef(selectedLogoUrl,'takeover-logos',IMAGE_STORED_LIMIT);return selectedLogoUrl||profile?.logo_url||null}",'logo upload removed state')

          # Presets list + art-focused additions.
          s=rep(s,"['gravity','GRAVITY'],['liquid','LIQUID'],['kinetic','KINETIC'],['stardust','STARDUST']","['gravity','GRAVITY'],['liquid','LIQUID'],['kinetic','KINETIC'],['stardust','STARDUST'],['dreamscape','DREAMSCAPE'],['stickerbomb','STICKER BOMB'],['laser','LASER'],['cutpaper','CUT PAPER'],['afterdark','AFTER DARK']",'preset list')
          marker="case'stardust':c.bg={type:'gradient',color:'#07070a',color2:'#151522',angle:120};c.layers=[presetShape(0,0,100,100,'#ffffff',0,.8,0,'none','particles'),presetShape(64,5,30,30,'#c6a6ff',50,.9,0,'orbit','ring'),presetShape(5,72,18,18,'#fff0a8',0,.9,0,'flicker','burst'),Object.assign(presetText(brand,10,29,80,30,'serif',30,'#ffffff'),{motion:'float',z:5}),Object.assign(presetText('make some noise',45,62,45,10,'script',13,'#d7c7ff','right'),{motion:'drift',z:6}),logo&&Object.assign(logo,{motion:'flicker',z:7})];break;"
          additions=marker+"\ncase'dreamscape':c.bg={type:'gradient',color:'#ffd8ec',color2:'#b9ddff',angle:135};c.layers=[presetShape(-10,-12,48,48,'#fff6b7',50,.75,-8,'morph','orb'),presetShape(67,57,46,46,'#9d74ff',50,.5,12,'float','orb'),presetShape(0,0,100,100,'#ffffff',0,.65,0,'none','particles'),Object.assign(presetText('dream it louder',8,12,84,14,'script',16,'#5b347d'),{motion:'drift',z:7}),Object.assign(presetText(brand,9,37,82,30,'serif',30,'#16131d'),{motion:'float',z:8}),logo&&Object.assign(logo,{x:36,y:72,w:28,h:18,z:9,motion:'pulse'})];break;\ncase'stickerbomb':c.bg={type:'solid',color:'#f7ef35'};c.layers=[presetShape(-6,6,42,32,'#ff4f91',0,1,-12,'shake','cutout'),presetShape(68,-4,34,34,'#4bd7ff',0,.95,8,'spin','spark'),presetShape(59,67,46,19,'#111111',50,1,-7,'sweep','capsule'),Object.assign(presetText('NO QUIET ADS',5,9,54,17,'display',21,'#111111','left'),{motion:'shake',z:8}),Object.assign(presetText(brand,7,38,86,29,'heavy',29,'#111111'),{rotation:-4,motion:'zoom',z:9}),Object.assign(presetText(site||'TAKE THE SPACE',53,73,42,10,'mono',8,'#ffffff'),{rotation:-7,z:10}),logo&&Object.assign(logo,{x:64,y:12,w:28,h:20,motion:'bounce',z:11})];break;\ncase'laser':c.bg={type:'gradient',color:'#03030a',color2:'#15002c',angle:160};c.layers=[presetShape(0,0,100,100,'#58f6ff',0,.75,0,'none','particles'),presetShape(7,8,42,42,'#ff2bd6',50,.9,0,'orbit','ring'),presetShape(72,11,19,19,'#58f6ff',0,1,0,'flicker','spark'),presetShape(18,72,70,6,'#7b5cff',50,.9,-5,'sweep','capsule'),Object.assign(presetText(brand,8,37,84,28,'tech',27,'#ffffff'),{motion:'flicker',z:8}),Object.assign(presetText(site||'ENTER THE GRID',12,66,76,10,'mono',9,'#58f6ff'),{motion:'drift',z:9}),logo&&Object.assign(logo,{x:37,y:8,w:26,h:18,motion:'pulse',z:10})];break;\ncase'cutpaper':c.bg={type:'solid',color:'#f6f0e4'};c.layers=[presetShape(-10,2,58,38,'#ff765d',0,1,-8,'float','cutout'),presetShape(58,58,55,46,'#6d80ff',0,.95,11,'drift','cutout'),presetShape(69,5,24,24,'#ffd449',0,1,0,'spin','spark'),Object.assign(presetText('THIS SPACE IS',8,19,58,12,'mono',9,'#181818','left'),{rotation:-3,z:7}),Object.assign(presetText(brand,10,36,80,31,'editorial',31,'#111111'),{rotation:2,motion:'float',z:8}),logo&&Object.assign(logo,{x:10,y:72,w:28,h:18,rotation:-6,z:9}),Object.assign(presetText(site||'JUST LOOK AT IT',48,77,45,9,'condensed',10,'#ffffff','right'),{rotation:8,z:10})];break;\ncase'afterdark':c.bg={type:'gradient',color:'#080511',color2:'#32125d',angle:135};c.layers=[presetShape(-12,50,44,44,'#ff4fa3',50,.48,0,'morph','orb'),presetShape(70,-8,42,42,'#55d8ff',50,.38,0,'orbit','orb'),presetShape(0,0,100,100,'#ffffff',0,.8,0,'none','particles'),presetShape(12,17,76,7,'#9f7cff',50,.7,0,'sweep','capsule'),Object.assign(presetText('AFTER DARK',10,24,80,12,'condensed',15,'#bda7ff'),{motion:'flicker',z:7}),Object.assign(presetText(brand,8,42,84,29,'modern',30,'#ffffff'),{motion:'zoom',z:8}),logo&&Object.assign(logo,{x:38,y:73,w:24,h:17,motion:'float',z:9})];break;"
          s=rep(s,marker,additions,'art preset cases')

          # Saved design library functions before preset rendering.
          marker="function renderPresetChoices(){const box=$('#canvasPresets');if(!box)return;"
          library="""async function loadSavedDesigns(){if(!session){savedDesigns=[];renderSavedDesignChoices();return savedDesigns}const {data,error}=await sb.from('takeover_saved_designs').select('id,title,display_name,website,logo_url,canvas_json,created_at,updated_at').order('updated_at',{ascending:false}).limit(40);if(error){console.error('saved designs',error);return savedDesigns}savedDesigns=(data||[]).map(d=>({...d,canvas_json:normalizeCanvas(d.canvas_json,d.display_name,d.logo_url)}));renderSavedDesignChoices();return savedDesigns}
function applySavedDesign(d){if(!d||!editorCanvas)return;const frame=[...(editorCanvas.frameCells||[])];editorCompany=d.display_name||'YOUR BRAND';editorWebsite=d.website||'';selectedLogoUrl=d.logo_url||null;logoExplicitlyRemoved=!d.logo_url;editorCanvas=normalizeCanvas(d.canvas_json,editorCompany,selectedLogoUrl);if(frame.length)editorCanvas.frameCells=frame;if($('#canvasCompany'))$('#canvasCompany').value=editorCompany;if($('#canvasWebsite'))$('#canvasWebsite').value=editorWebsite;renderEditor();renderPresetChoices();renderSavedDesignChoices();toast('Saved design loaded')}
function renderSavedDesignChoices(){const box=$('#canvasSavedDesigns'),section=$('#canvasSavedSection');if(!box||!section)return;if(!session){section.hidden=false;box.innerHTML='<div class="saved-design-empty">SIGN IN TO SAVE & REUSE YOUR OWN DESIGNS</div>';return}section.hidden=false;box.innerHTML='';if(!savedDesigns.length){box.innerHTML='<div class="saved-design-empty">NO SAVED DESIGNS YET</div>';return}savedDesigns.forEach(d=>{const b=document.createElement('button');b.type='button';b.className='preset-card saved-preset-card';const thumb=document.createElement('i');thumb.className='preset-thumb';thumb.appendChild(buildCanvasCreative({company_name:d.display_name,website:d.website,logo_url:d.logo_url,canvas_json:d.canvas_json},null,null,false));const name=document.createElement('span');name.textContent=d.title;b.append(thumb,name);b.onclick=()=>applySavedDesign(d);box.appendChild(b)})}
async function saveCurrentDesignToLibrary(){if(!editorCanvas)return;if(!session){currentCanvas=JSON.parse(JSON.stringify(editorCanvas));editorCompany=($('#canvasCompany')?.value||editorCompany||'YOUR BRAND').trim();editorWebsite=normalizeWebsite($('#canvasWebsite')?.value||editorWebsite||'');closeCanvasEditor();saveDraft();toast('Sign in to save designs to your private library');openAuth();return}const proposed=(editorCompany||'MY DESIGN').trim().slice(0,60)||'MY DESIGN',title=String(prompt('Name this saved design',proposed)||'').trim().slice(0,60);if(!title)return;const btn=$('#saveLibraryDesign'),old=btn?.textContent;if(btn){btn.disabled=true;btn.textContent='SAVING…'}try{let canvas=JSON.parse(JSON.stringify(editorCanvas)),logo=selectedLogoUrl||null,replacements={};if(String(logo||'').startsWith(LOCAL_ASSET_PREFIX)){const uploaded=await uploadLocalRef(logo,'takeover-logos',IMAGE_STORED_LIMIT);replacements[logo]=uploaded;logo=uploaded}canvas=await materializeCanvasAssets(canvas,replacements);const name=($('#canvasCompany')?.value||editorCompany||'YOUR BRAND').trim().slice(0,80)||'YOUR BRAND',website=normalizeWebsite($('#canvasWebsite')?.value||editorWebsite||'');const {error}=await sb.from('takeover_saved_designs').insert({user_id:session.user.id,title,display_name:name,website,logo_url:logo,canvas_json:canvas});if(error)throw error;editorCanvas=canvas;editorCompany=name;editorWebsite=website;selectedLogoUrl=logo;await loadSavedDesigns();toast('Design saved to your private library')}catch(e){toast(e.message||'Could not save design')}finally{if(btn){btn.disabled=false;btn.textContent=old||'SAVE TO MY LIBRARY'}}}
async function deleteSavedDesign(id){if(!session||!id)return;if(!confirm('Delete this saved design from your library?'))return;const {error}=await sb.from('takeover_saved_designs').delete().eq('id',id);if(error)return toast(error.message);await loadSavedDesigns();await renderSavedDesignLibrary();toast('Saved design deleted')}
function queueSavedDesign(id){if(!id)return;localStorage.setItem('takeover_saved_design_next',String(id));closePanels();toast('Design ready — choose a spot, then open DESIGN IT')}
async function renderSavedDesignLibrary(){const box=$('#myDesigns');if(!box)return;if(!session){box.innerHTML='<div class="empty">Sign in to see saved designs.</div>';return}await loadSavedDesigns();box.innerHTML='';if(!savedDesigns.length){box.innerHTML='<div class="empty">No saved designs yet. Save one from SPOT CANVAS.</div>';return}savedDesigns.forEach(d=>{const card=document.createElement('div');card.className='saved-design-card';const preview=document.createElement('div');preview.className='saved-design-preview';preview.appendChild(buildCanvasCreative({company_name:d.display_name,website:d.website,logo_url:d.logo_url,canvas_json:d.canvas_json},null,null,false));const meta=document.createElement('div');meta.className='saved-design-meta';meta.innerHTML=`<div><b>${esc(d.title)}</b><span>${esc(d.display_name)}${d.website?' · '+esc(host(d.website)):''}</span></div>`;const actions=document.createElement('div');actions.className='saved-design-actions';const use=document.createElement('button');use.type='button';use.textContent='USE NEXT';use.onclick=()=>queueSavedDesign(d.id);const del=document.createElement('button');del.type='button';del.className='danger';del.textContent='DELETE';del.onclick=()=>deleteSavedDesign(d.id);actions.append(use,del);card.append(preview,meta,actions);box.appendChild(card)})}
"""+marker
          s=rep(s,marker,library,'saved design functions')

          # Canvas modal: private library carousel + save button + shape choices.
          s=rep(s,'<div class="canvas-presets" id="canvasPresets"></div><div class="canvas-toolbar">','<div class="canvas-presets" id="canvasPresets"></div><div class="saved-design-section" id="canvasSavedSection"><div class="preset-title"><div><b>MY DESIGNS</b><span>Private to your account. Reuse them after an outbid.</span></div></div><div class="canvas-presets saved-design-presets" id="canvasSavedDesigns"></div></div><div class="canvas-toolbar">','canvas saved design section')
          s=rep(s,'<button class="canvas-save" id="saveCanvas">USE THIS DESIGN</button>','<button class="canvas-library-save" id="saveLibraryDesign">SAVE TO MY LIBRARY</button><button class="canvas-save" id="saveCanvas">USE THIS DESIGN</button>','save library button')
          s=rep(s,"<option value=\"particles\">Particle Field</option></select>","<option value=\"particles\">Particle Field</option><option value=\"orb\">Soft Orb</option><option value=\"spark\">Spark</option><option value=\"cutout\">Cut Paper</option><option value=\"capsule\">Capsule</option></select>",'shape selector')
          s=rep(s,"$('#saveCanvas').onclick=saveCanvasEditor}","$('#saveLibraryDesign').onclick=saveCurrentDesignToLibrary;$('#saveCanvas').onclick=saveCanvasEditor}",'save library wire')

          # Open Canvas loads account library and optionally queued design.
          old="$('#scrim').classList.add('on');$('#canvasModal').classList.add('on');hydrateCanvasAssets(editorCanvas).then(()=>{renderEditor();renderPresetChoices()}).catch(()=>{})}"
          new="$('#scrim').classList.add('on');$('#canvasModal').classList.add('on');hydrateCanvasAssets(editorCanvas).then(()=>{renderEditor();renderPresetChoices()}).catch(()=>{});loadSavedDesigns().then(()=>{const queued=context==='purchase'?localStorage.getItem('takeover_saved_design_next'):null;if(queued){const d=savedDesigns.find(x=>x.id===queued);localStorage.removeItem('takeover_saved_design_next');if(d)applySavedDesign(d)}else renderSavedDesignChoices()}).catch(()=>{})}"
          s=rep(s,old,new,'canvas library load')

          # Account renders saved designs.
          s=rep(s,"$$('[data-defend]').forEach(b=>b.onclick=()=>{closePanels();openDefend(Number(b.dataset.defend))});await renderAlerts()}","$$('[data-defend]').forEach(b=>b.onclick=()=>{closePanels();openDefend(Number(b.dataset.defend))});await renderSavedDesignLibrary();await renderAlerts()}",'account library render')

          # Ensure saved library remains private on sign out.
          s=rep(s,"if($('#signOut'))$('#signOut').onclick=async()=>{await sb.auth.signOut();closePanels();toast('Signed out')};","if($('#signOut'))$('#signOut').onclick=async()=>{await sb.auth.signOut();savedDesigns=[];localStorage.removeItem('takeover_saved_design_next');closePanels();toast('Signed out')};",'signout cleanup')

          save(p,s)

          # CSS: remove logo action, art shapes, saved library.
          p='takeover-v3.css'; s=load(p)
          s += '''\n\n/* TAKEOVER V20 — private design library + art shapes */\n.logo-drop{position:relative!important}.logo-remove{position:absolute;left:14px;top:14px;z-index:5;border:1px solid rgba(17,17,17,.28);background:rgba(255,255,255,.94);color:#a62a18;border-radius:9px;padding:9px 11px;font:850 8px 'DM Mono',monospace;letter-spacing:.04em;cursor:pointer}.logo-remove:hover{background:#111;color:#fff;border-color:#111}.logo-choose{right:14px!important;left:auto!important;top:14px!important;bottom:auto!important}.canvas-library-save{width:100%;height:42px;border:1px solid #111;border-radius:10px;background:#fff;color:#111;font:900 9px 'DM Mono',monospace;letter-spacing:.04em;margin-bottom:8px}.canvas-library-save:hover{background:#f0f0ea}.saved-design-section{margin:0 0 8px}.saved-design-presets{margin-bottom:8px!important}.saved-design-empty{flex:0 0 100%;border:1px dashed #d2d2ca;border-radius:10px;padding:15px;color:#777;font:750 8px 'DM Mono',monospace;text-align:center}.saved-preset-card{border-color:#111}.saved-preset-card>span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.saved-design-card{display:grid;grid-template-columns:94px minmax(0,1fr);gap:10px;border:1px solid #d9d9d2;border-radius:13px;background:#fff;padding:9px;margin-top:9px}.saved-design-preview{position:relative;height:82px;border-radius:9px;overflow:hidden;border:1px solid #ddd;background:#f3f3ee}.saved-design-preview .canvas-creative{position:absolute!important}.saved-design-meta{display:flex;align-items:center;min-width:0}.saved-design-meta b{display:block;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.saved-design-meta span{display:block;margin-top:4px;color:#777;font-size:8px;line-height:1.35;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.saved-design-actions{grid-column:1/-1;display:flex;gap:6px}.saved-design-actions button{flex:1;border:1px solid #d2d2cb;background:#fff;border-radius:8px;padding:8px;font:800 8px 'DM Mono',monospace}.saved-design-actions button:first-child{background:#111;color:#fff;border-color:#111}.saved-design-actions button.danger{color:#a62a18;background:#fff7f5;border-color:#ecc8c1}.canvas-layer.is-shape[data-shape="orb"],.editor-layer.is-shape[data-shape="orb"]{border-radius:50%!important;filter:blur(.2px);box-shadow:0 0 40px color-mix(in srgb,var(--shape-fill) 45%,transparent)}.canvas-layer.is-shape[data-shape="capsule"],.editor-layer.is-shape[data-shape="capsule"]{border-radius:999px!important}.canvas-layer.is-shape[data-shape="spark"],.editor-layer.is-shape[data-shape="spark"]{clip-path:polygon(50% 0,59% 35%,100% 50%,59% 63%,50% 100%,40% 63%,0 50%,40% 35%)}.canvas-layer.is-shape[data-shape="cutout"],.editor-layer.is-shape[data-shape="cutout"]{clip-path:polygon(3% 12%,21% 3%,43% 9%,61% 2%,94% 15%,88% 39%,99% 61%,82% 91%,53% 84%,30% 98%,8% 82%,14% 55%,0 34%)}#signedAs{line-height:1.5!important}#signedAs strong{color:#111;font-size:10px}\n@media(max-width:720px){.saved-design-card{grid-template-columns:82px minmax(0,1fr)}.saved-design-preview{height:72px}.logo-remove{left:10px;top:10px;padding:8px;font-size:7px}.logo-choose{right:10px!important;top:10px!important}.canvas-library-save{height:46px}}\n'''
          save(p,s)

