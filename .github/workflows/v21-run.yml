name: TAKEOVER V21 Runner
'on':
  push:
    branches: [main]
    paths: ['.github/workflows/v21-run.yml']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply V21 patch
        run: python .takeover-v21-patch.py
      - name: Verify
        run: |
          node --check takeover-v3.js
          node --check boot.js
          grep -q 'takeover-v3.js?v=21' boot.js
          grep -q 'boot.js?v=17' index.html
          grep -q 'adminHistorySpotFilter' index.html
          grep -q 'RESTORE THIS STATE' takeover-v3.js
          grep -q 'VACATE · KEEP PRICE' takeover-v3.js
      - name: Commit
        run: |
          git config user.name 'TAKEOVER Build'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html takeover-v3.js takeover-v3.css boot.js .github/workflows/ci-v18.yml
          git commit -m 'Add bounded spot history and owner controls'
          git push
