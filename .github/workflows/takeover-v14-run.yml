name: TAKEOVER V14 Runner
'on':
  push:
    branches: [main]
    paths: ['.github/workflows/takeover-v14-run.yml']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Execute V14 patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('.github/workflows/takeover-v14-support-security.yml').read_text()
          a=s.index('      - name: Add support console and browser hardening')
          a=s.index('        run: |',a)+len('        run: |\n')
          b=s.index('      - name: Verify V14',a)
          lines=[]
          for line in s[a:b].splitlines():
              lines.append(line[10:] if line.startswith('          ') else line)
          Path('/tmp/v14-build.sh').write_text('\n'.join(lines)+'\n')
          PY
          bash /tmp/v14-build.sh
      - name: Verify V14
        run: |
          node --check takeover-v3.js
          node --check contact.js
          node --check boot.js
          grep -q 'data-admin-tab="support"' index.html
          grep -q 'id="adminSupport"' index.html
          grep -q 'renderAdminSupport' takeover-v3.js
          grep -q 'takeover-support' contact.js
          if grep -q "from('support_requests').insert" contact.js; then exit 1; fi
          grep -q 'Content-Security-Policy' index.html
          grep -q 'Content-Security-Policy' contact.html
          grep -q 'takeover-v3.js?v=14' boot.js
          grep -q 'takeover-v3.css?v=14' boot.js
          grep -q 'boot.js?v=10' index.html
          grep -q 'contact.js?v=2' contact.html
      - name: Commit V14
        run: |
          git config user.name "TAKEOVER Builder"
          git config user.email "actions@users.noreply.github.com"
          git add index.html takeover-v3.js takeover-v3.css boot.js contact.html contact.js
          git commit -m "Add protected support inbox and browser security policy"
          git push
