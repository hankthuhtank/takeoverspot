name: TAKEOVER Canvas V6
on:
  push:
    branches: [main]
    paths: ['tools/canvas_v6_patch.py', '.github/workflows/canvas-v6.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python tools/canvas_v6_patch.py
      - run: node --check takeover-v3.js
      - name: Verify V6 geometry and upload changes
        run: |
          grep -q "logo-trigger" takeover-v3.js
          grep -q "multiSpotSection" takeover-v3.js
          grep -q "selectionComponents" takeover-v3.js
          grep -q "ensureShapeClip" takeover-v3.js
          grep -q "syncEditorStageShape" takeover-v3.js
          grep -q "t.style.clipPath=r.clip" takeover-v3.js
          grep -q "takeover-v3.js?v=6" boot.js
          grep -q "takeover-v3.css?v=6" boot.js
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm install jsdom@25 --no-save
      - name: Browserless interaction check
        run: |
          cat > v6.cjs <<'JS'
          const fs=require('fs'),{JSDOM}=require('jsdom');
          const html=fs.readFileSync('index.html','utf8').replace(/<script[^>]*src=[^>]*><\/script>/g,'');
          const dom=new JSDOM(html,{url:'https://takeoverspot.com/',runScripts:'outside-only',pretendToBeVisual:true}),w=dom.window;
          if(!w.crypto.randomUUID)w.crypto.randomUUID=()=>Math.random().toString(16).slice(2)+'-0000-4000-8000-000000000000';
          const board=Array.from({length:16},(_,i)=>({spot_number:i+1,current_price:0,owner_key:null,company_name:null,website:null,logo_url:null,creative_id:null,canvas_json:null,owner_since:null,updated_at:new Date().toISOString()}));
          const cfg={starting_price:10,min_increment:1,purchases_enabled:true,page_shield_until:null};
          function builder(t){const b={select(){return b},eq(){return b},is(){return b},in(){return Promise.resolve({data:[],error:null})},update(){return b},insert(){return Promise.resolve({data:null,error:null})},limit(){return Promise.resolve({data:[],error:null})},order(){return Promise.resolve({data:t==='takeover_spots'?board:[],error:null})},maybeSingle(){return Promise.resolve({data:t==='takeover_config'?cfg:null,error:null})},then(r){return Promise.resolve({data:t==='takeover_spots'?board:[],error:null}).then(r)}};return b}
          const sb={auth:{getSession:()=>Promise.resolve({data:{session:null}}),onAuthStateChange:()=>({data:{subscription:{unsubscribe(){}}}}),signOut:()=>Promise.resolve(),signInWithOtp:()=>Promise.resolve({error:null})},from:builder,rpc:(n)=>Promise.resolve({data:n==='is_takeover_admin'?false:null,error:null}),channel:()=>({on(){return this},subscribe(){return this}}),removeChannel(){},storage:{from:()=>({upload:()=>Promise.resolve({error:null}),getPublicUrl:()=>({data:{publicUrl:'https://xvfgiaxxvwdnmzzdfboc.supabase.co/storage/v1/object/public/takeover-creative/test/a.png'}})})},functions:{invoke:()=>Promise.resolve({data:{url:'https://stripe.test'},error:null})}};
          w.supabase={createClient:()=>sb};
          w.eval(fs.readFileSync('takeover-v3.js','utf8'));
          setTimeout(()=>{
            w.document.querySelector('#introGotIt')?.click();
            [...w.document.querySelectorAll('.available-cell')][2].click();
            w.document.querySelector('#companyName').value='Shape Co';
            w.document.querySelector('#companyWebsite').value='shape.test';
            w.document.querySelector('#openPurchaseCanvas').click();
            const multi=w.document.querySelector('#multiSpotSection');
            const stage=w.document.querySelector('#canvasStage');
            if(!multi.hidden)throw Error('Single spot should hide multi display');
            if(stage.style.aspectRatio!=='1 / 1'&&stage.style.aspectRatio!=='1/1')throw Error('Single spot canvas not square: '+stage.style.aspectRatio);
            w.document.querySelector('#canvasClose').click();
            const clickMini=n=>[...w.document.querySelectorAll('.mini-spot')][n-1].click();
            clickMini(7);clickMini(11);clickMini(12);
            w.document.querySelector('#openPurchaseCanvas').click();
            if(multi.hidden)throw Error('Multi display should show for 4 spots');
            if(stage.style.aspectRatio!=='2 / 3'&&stage.style.aspectRatio!=='2/3')throw Error('Combined shape ratio wrong: '+stage.style.aspectRatio);
            if(!stage.style.clipPath.includes('takeover-shape-3-7-11-12'))throw Error('Combined shape clip missing: '+stage.style.clipPath);
            w.document.querySelector('#displayDivided').click();
            if(stage.style.aspectRatio!=='1 / 1'&&stage.style.aspectRatio!=='1/1')throw Error('Divided canvas should be square: '+stage.style.aspectRatio);
            if(stage.style.clipPath!=='none')throw Error('Divided canvas should not be clipped: '+stage.style.clipPath);
            w.document.querySelector('#displayCombined').click();
            if(!stage.style.clipPath.includes('takeover-shape-3-7-11-12'))throw Error('Combined shape did not restore');
            const trigger=w.document.querySelector('#logoPreview .logo-trigger');
            if(!trigger||trigger.htmlFor!=='logoFile')throw Error('Full-box logo label missing');
            console.log('PASS TAKEOVER CANVAS V6');process.exit(0);
          },500);
          JS
          timeout 15s node v6.cjs
      - name: Commit Canvas V6
        run: |
          git config user.name "TAKEOVER Builder"
          git config user.email "actions@users.noreply.github.com"
          git add takeover-v3.js takeover-v3.css boot.js
          git commit -m "Fix multi-spot canvas geometry and logo target"
          git push
