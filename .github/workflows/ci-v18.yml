name: TAKEOVER V1.0.1 Launch Gate
'on':
  push:
    branches: [main]
    paths: ['index.html','takeover-v3.js','takeover-v3.css','takeover.css','boot.js','vendor/supabase-2.112.4.min.js','contact.js','contact.html','terms.html','auction-rules.html','payments.html','privacy.html','content-policy.html','.github/workflows/ci-v18.yml']
  pull_request:
    paths: ['index.html','takeover-v3.js','takeover-v3.css','takeover.css','boot.js','vendor/supabase-2.112.4.min.js','contact.js','contact.html','terms.html','auction-rules.html','payments.html','privacy.html','content-policy.html']
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax
        run: |
          node --check takeover-v3.js
          node --check boot.js
          node --check contact.js
      - name: V1.0.1 architecture
        run: |
          grep -q 'const APP_VERSION=' takeover-v3.js
          grep -q "APP_VERSION='1.0.1'" takeover-v3.js
          grep -q 'const TOTAL=16' takeover-v3.js || grep -q "TOTAL=16" takeover-v3.js
          grep -q 'takeover-v3.js?v=1.0.1' boot.js
          grep -q 'takeover-v3.css?v=1.0.1' boot.js
          grep -q 'boot.js?v=1.0.1' index.html
          grep -q 'vendor/supabase-2.112.4.min.js' index.html
          test -s vendor/supabase-2.112.4.min.js
          ! grep -q 'cdn.jsdelivr.net/npm/@supabase/supabase-js@2' index.html
          grep -q 'window.self!==window.top' boot.js
          grep -q 'TAKEOVER V22 DESKTOP READABILITY' takeover-v3.css
          grep -q 'TAKEOVER V22.1 DESKTOP TYPE COMPLETION' takeover-v3.css
          grep -q 'TAKEOVER V22.2' takeover-v3.css
          grep -q 'TAKEOVER V22.3' takeover-v3.css
          grep -q 'TAKEOVER V1.0 LAUNCH' takeover-v3.css
          grep -q 'TAKEOVER V1.0.1' takeover-v3.css
      - name: Core product contracts
        run: |
          grep -q 'frameCells' takeover-v3.js
          grep -q 'startLayerTouch' takeover-v3.js
          grep -q 'Particle Field' takeover-v3.js
          grep -q 'SAVE TO MY LIBRARY' takeover-v3.js
          grep -q 'REMOVE LOGO' takeover-v3.js
          grep -q 'anonymous to visitors' takeover-v3.js
          grep -q 'takeover_spot_history' takeover-v3.js
          grep -q 'admin_restore_takeover_spot' takeover-v3.js
          grep -q 'admin_set_takeover_spot_price' takeover-v3.js
          grep -q 'admin_vacate_takeover_spot' takeover-v3.js
          grep -q 'admin_hide_takeover_spot_content' takeover-v3.js
      - name: Cross-device WYSIWYG contract
        run: |
          grep -q -- '--takeover-board-size:min(100vw' takeover-v3.css
          grep -q 'width:var(--takeover-board-size)!important;height:var(--takeover-board-size)!important' takeover-v3.css
          grep -q 'font-size:var(--layer-size,5cqw)!important' takeover-v3.css
          grep -q "d.style.setProperty('--layer-size'" takeover-v3.js
          grep -q "file.type!=='image/jpeg'" takeover-v3.js
          grep -q 'EXACT PUBLISHED COMPOSITION · MOBILE = DESKTOP' takeover-v3.js
          grep -q 'frame.style.aspectRatio' takeover-v3.js
          node - <<'JS'
          const fs=require('fs'),s=fs.readFileSync('takeover-v3.js','utf8'),c=fs.readFileSync('takeover-v3.css','utf8');
          if(s.includes('d.style.fontSize=`${clamp(l.size||18,8,200)}px`')) throw Error('editor-only pixel typography returned');
          if(!c.includes('.territory,.canvas-stage{container-type:size!important}')) throw Error('shared canvas query space missing');
          if(!c.includes('@media(max-width:720px)')||!c.includes('--takeover-board-size')) throw Error('mobile canonical board contract missing');
          console.log('PASS CROSS-DEVICE WYSIWYG CONTRACT');
          JS
      - name: Mobile-first camera regression
        run: |
          grep -q -- '--takeover-board-size:min(140vw' takeover-v3.css
          grep -q 'overflow-x:auto!important' takeover-v3.css
          grep -q 'top:54px!important' takeover-v3.css
          grep -q "b.dataset.short" takeover-v3.js
          grep -q 'take-pill::after{content:attr(data-short)' takeover-v3.css
          grep -q 'canvas-stage:not(.is-preview) .editor-layer{animation:none!important}' takeover-v3.css
          node - <<'JS'
          const fs=require('fs'),s=fs.readFileSync('takeover-v3.js','utf8'),c=fs.readFileSync('takeover-v3.css','utf8');
          const editor='.editor-content{display:block!important;width:100%!important;min-width:0!important;max-width:100%!important;max-height:100%!important;overflow:hidden!important';
          if(!c.includes(editor)) throw Error('editor/live text containment drift returned');
          if(!c.includes('overscroll-behavior-x:contain!important')) throw Error('mobile board camera no longer pans safely');
          if(!s.includes("b.setAttribute('aria-label',b.textContent)")) throw Error('compact mobile action lost accessible label');
          console.log('PASS MOBILE-FIRST CAMERA CONTRACT');
          JS
      - name: Canvas preview regression
        run: |
          grep -q 'toggleCanvasPreview' takeover-v3.js
          grep -q 'editorPreviewMode' takeover-v3.js
          grep -q 'canvas-preview-live' takeover-v3.js
          grep -q "btn.textContent=editorPreviewMode?'EDIT':'PREVIEW'" takeover-v3.js
          grep -q 'EXACT PUBLISHED COMPOSITION · MOBILE = DESKTOP' takeover-v3.js
          grep -q 'canvas-stage.is-preview .editor-grid' takeover-v3.css
          grep -q 'canvas-stage .canvas-preview-live .canvas-layer' takeover-v3.css
      - name: Spot control containment regression
        run: |
          grep -q 'spot-history-preview{position:relative' takeover-v3.css
          grep -q 'spot-history-preview>.canvas-creative' takeover-v3.css
          grep -q 'RESTORE THIS STATE' takeover-v3.js
          grep -q 'VACATE · KEEP PRICE' takeover-v3.js
      - name: Refund safety regression
        run: |
          grep -q 'refundTerritoryAction' index.html
          grep -q 'value="restore_previous"' index.html
          grep -q 'value="vacate_keep_price"' index.html
          grep -q 'syncRefundTerritoryAction' takeover-v3.js
          grep -q "kind==='takeover'?'restore_previous':'none'" takeover-v3.js
          grep -q 'Partial refunds leave territory unchanged' takeover-v3.js
          grep -q 'territory_action:territoryAction' takeover-v3.js
          ! grep -q 'refundResetTerritory' index.html
          ! grep -q 'refundResetTerritory' takeover-v3.js
          ! grep -q 'reset_territory:reset' takeover-v3.js
      - name: Optional link and canvas regression
        run: |
          node - <<'JS'
          const fs=require('fs'),s=fs.readFileSync('takeover-v3.js','utf8');
          if(!s.includes("interactive&&link?'a':'div'")) throw Error('linkless territories are no longer display-only');
          if(s.includes("if(!website)return toast('Enter your website')")) throw Error('website became mandatory');
          if(!s.includes("layer.size=clamp(editorTouchGesture.os*scale,8,96)")) throw Error('text pinch regression');
          if(!s.includes('raw=await f.arrayBuffer()')) throw Error('mobile upload hardening missing');
          console.log('PASS PRODUCT REGRESSIONS');
          JS
      - name: Legal contract
        run: |
          grep -q 'THE WEBPAGE BELONGS TO WHOEVER WANTS IT MOST.' auction-rules.html
          grep -qi 'Future seasons and historical archives' terms.html
          ! grep -qi 'season' index.html
          ! grep -qi 'season' auction-rules.html
          ! grep -qi 'season' payments.html
          ! grep -qi 'archive' privacy.html
          grep -q 'Placement has no guaranteed minimum duration or cash value.' index.html
      - name: Repo hygiene
        run: |
          test ! -e launch.js
          test ! -e launch.css
          test ! -e polish.js
          test ! -e polish.css
          test ! -e takeover-v2.js
