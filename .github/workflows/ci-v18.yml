name: TAKEOVER V1.1.2 Launch Gate
'on':
  push:
    branches: [main]
    paths: ['index.html','takeover-v3.js','takeover-v3.css','takeover.css','boot.js','board-view.js','canvas-presets.js','board-snapshot.js','daily-snapshots.js','snapshot-render.html','snapshot-render.css','scripts/**','supabase/**','vendor/html-to-image-1.11.13.js','tests/**','vendor/supabase-2.112.4.min.js','contact.js','contact.html','terms.html','auction-rules.html','payments.html','privacy.html','content-policy.html','.github/workflows/ci-v18.yml']
  pull_request:
    paths: ['index.html','takeover-v3.js','takeover-v3.css','takeover.css','boot.js','board-view.js','canvas-presets.js','board-snapshot.js','daily-snapshots.js','snapshot-render.html','snapshot-render.css','scripts/**','supabase/**','vendor/html-to-image-1.11.13.js','tests/**','vendor/supabase-2.112.4.min.js','contact.js','contact.html','terms.html','auction-rules.html','payments.html','privacy.html','content-policy.html']
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax
        run: |
          node --check takeover-v3.js
          node --check boot.js
          node --check board-view.js
          node --check board-snapshot.js
          node --check daily-snapshots.js
          node --check scripts/render-daily-snapshots.cjs
          node --check canvas-presets.js
          node --check contact.js
      - name: V1.1.2 architecture
        run: |
          grep -q 'const APP_VERSION=' takeover-v3.js
          grep -q "APP_VERSION='1.1.2'" takeover-v3.js
          grep -q 'const TOTAL=16' takeover-v3.js || grep -q "TOTAL=16" takeover-v3.js
          grep -q 'takeover-v3.js?v=1.1.2' boot.js
          grep -q 'takeover-v3.css?v=1.1.2' index.html
          grep -q 'boot.js?v=1.1.2' index.html
          grep -q 'vendor/supabase-2.112.4.min.js' index.html
          test -s vendor/supabase-2.112.4.min.js
          ! grep -q 'cdn.jsdelivr.net/npm/@supabase/supabase-js@2' index.html
          grep -q 'window.self!==window.top' boot.js
          grep -q 'TAKEOVER V22 DESKTOP READABILITY' takeover-v3.css
          grep -q 'TAKEOVER V22.1 DESKTOP TYPE COMPLETION' takeover-v3.css
          grep -q 'TAKEOVER V22.2' takeover-v3.css
          grep -q 'TAKEOVER V22.3' takeover-v3.css
          grep -q 'TAKEOVER V1.0 LAUNCH' takeover-v3.css
          grep -q 'V1.1 — one board surface' takeover-v3.css
      - name: Core product contracts
        run: |
          grep -q 'frameCells' takeover-v3.js
          grep -q 'startLayerTouch' takeover-v3.js
          grep -q 'Particle Field' takeover-v3.js
          grep -q 'SAVE TO MY LIBRARY' takeover-v3.js
          grep -q 'REMOVE LOGO' takeover-v3.js
          grep -q 'anonymous to visitors' takeover-v3.js
          grep -q 'takeover_spot_history' takeover-v3.js
          grep -q 'admin_restore_takeover_spot' takeover-v3.js
          grep -q 'admin_set_takeover_spot_price' takeover-v3.js
          grep -q 'admin_vacate_takeover_spot' takeover-v3.js
          grep -q 'admin_hide_takeover_spot_content' takeover-v3.js
      - name: Cross-device geometry
        run: node --test tests/*.test.cjs
      - name: Install isolated DOM test dependency
        run: npm install --prefix "$RUNNER_TEMP/takeover-tests" --ignore-scripts --no-audit --no-fund jsdom@30.0.1
      - name: Board and editor interactions
        run: |
          NODE_PATH="$RUNNER_TEMP/takeover-tests/node_modules" node tests/interaction-smoke.cjs
          NODE_PATH="$RUNNER_TEMP/takeover-tests/node_modules" node tests/snapshot-smoke.cjs
          NODE_PATH="$RUNNER_TEMP/takeover-tests/node_modules" node tests/snapshot-management-smoke.cjs
      - name: Install browser export verification
        run: |
          npm install --prefix "$RUNNER_TEMP/snapshot-tests" --ignore-scripts --no-audit --no-fund playwright@1.55.0 sharp@0.34.3
          "$RUNNER_TEMP/snapshot-tests/node_modules/.bin/playwright" install --with-deps chromium
      - name: Verify saved-noon PNG in Chromium
        env:
          NODE_PATH: ${{ runner.temp }}/snapshot-tests/node_modules
        run: node tests/snapshot-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verified-noon-snapshot
          path: test-results/noon-export.png
          if-no-files-found: ignore
      - name: Canvas preview regression
        run: |
          grep -q 'toggleCanvasPreview' takeover-v3.js
          grep -q 'editorPreviewMode' takeover-v3.js
          grep -q 'canvas-preview-live' takeover-v3.js
          grep -q "btn.textContent=editorPreviewMode?'EDIT':'PREVIEW'" takeover-v3.js
          grep -q 'EXACT PUBLISHED COMPOSITION · MOBILE = DESKTOP' takeover-v3.js
          grep -q 'canvas-stage.is-preview .editor-grid' takeover-v3.css
          grep -q 'canvas-stage .canvas-preview-live .canvas-layer' takeover-v3.css
      - name: Spot control containment regression
        run: |
          grep -q 'spot-history-preview{position:relative' takeover-v3.css
          grep -q 'spot-history-preview>.canvas-creative' takeover-v3.css
          grep -q 'RESTORE THIS STATE' takeover-v3.js
          grep -q 'VACATE · KEEP PRICE' takeover-v3.js
      - name: Refund safety regression
        run: |
          grep -q 'refundTerritoryAction' index.html
          grep -q 'value="restore_previous"' index.html
          grep -q 'value="vacate_keep_price"' index.html
          grep -q 'syncRefundTerritoryAction' takeover-v3.js
          grep -q "kind==='takeover'?'restore_previous':'none'" takeover-v3.js
          grep -q 'Partial refunds leave territory unchanged' takeover-v3.js
          grep -q 'territory_action:territoryAction' takeover-v3.js
          ! grep -q 'refundResetTerritory' index.html
          ! grep -q 'refundResetTerritory' takeover-v3.js
          ! grep -q 'reset_territory:reset' takeover-v3.js
      - name: Optional link and canvas regression
        run: |
          node - <<'JS'
          const fs=require('fs'),s=fs.readFileSync('takeover-v3.js','utf8');
          if(!s.includes("interactive&&link?'a':'div'")) throw Error('linkless territories are no longer display-only');
          if(s.includes("if(!website)return toast('Enter your website')")) throw Error('website became mandatory');
          if(!s.includes("layer.size=clamp(editorTouchGesture.os*scale,8,96)")) throw Error('text pinch regression');
          if(!s.includes('raw=await f.arrayBuffer()')) throw Error('mobile upload hardening missing');
          console.log('PASS PRODUCT REGRESSIONS');
          JS
      - name: Legal contract
        run: |
          grep -q 'THE WEBPAGE BELONGS TO WHOEVER WANTS IT MOST.' auction-rules.html
          grep -qi 'Future seasons and historical archives' terms.html
          ! grep -qi 'season' index.html
          ! grep -qi 'season' auction-rules.html
          ! grep -qi 'season' payments.html
          ! grep -qi 'archive' privacy.html
          grep -q 'Placement has no guaranteed minimum duration or cash value.' index.html
      - name: Repo hygiene
        run: |
          test ! -e launch.js
          test ! -e launch.css
          test ! -e polish.js
          test ! -e polish.css
          test ! -e takeover-v2.js
  piktoor-mac:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - name: Download current Piktoor
        shell: bash
        run: |
          set -euo pipefail
          JSON="$(curl -fsSL 'https://safisolutions-downloads.safisolutions.workers.dev/api/free-download?product=piktoor')"
          URL="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["url"])' <<<"$JSON")"
          curl -fL "$URL" -o Piktoor.exe
          shasum -a 256 Piktoor.exe
      - name: Extract embedded application
        shell: bash
        run: |
          python3 - <<'PY'
          import struct, pathlib, zipfile
          p=pathlib.Path('Piktoor.exe').read_bytes()
          e=p.rfind(b'PK\x05\x06')
          if e < 0: raise SystemExit('No embedded ZIP found')
          sig,disk,cd_disk,n_disk,n_total,cd_size,cd_off,comment_len=struct.unpack_from('<4s4H2LH',p,e)
          start=e-cd_size-cd_off
          z=pathlib.Path('payload.zip')
          z.write_bytes(p[start:e+22+comment_len])
          with zipfile.ZipFile(z) as f: f.extractall('payload')
          PY
      - name: Apply macOS compatibility patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          f=Path('payload/resources/app/main.cjs')
          s=f.read_text()
          s=s.replace("const { app, BrowserWindow, dialog, ipcMain, clipboard, ClipboardItem, nativeImage, shell } = require('electron');",
                      "const { app, BrowserWindow, dialog, ipcMain, clipboard, nativeImage, shell } = require('electron');")
          s=s.replace("  const iconPath = path.join(__dirname, 'Piktoor.ico');",
                      "  const iconPath = path.join(__dirname, process.platform === 'darwin' ? 'Piktoor.png' : 'Piktoor.ico');")
          start=s.index("ipcMain.handle('piktoor:clipboardWriteImage'")
          end=s.index("ipcMain.handle('piktoor:fonts'")
          clip="""ipcMain.handle('piktoor:clipboardWriteImage', async (_event, value = {}) => {
  const image = nativeImage.createFromDataURL(String(value.dataUrl || ''));
  if (image.isEmpty()) throw new Error('Piktoor could not place that image on the system clipboard.');
  clipboard.writeImage(image);
  clipboard.writeBuffer(CUSTOM_CLIPBOARD, Buffer.from(String(value.token || ''), 'utf8'));
  return true;
});
ipcMain.handle('piktoor:clipboardMarkInternal', async (_event, token) => {
  clipboard.writeBuffer(CUSTOM_CLIPBOARD, Buffer.from(String(token || ''), 'utf8'));
  return true;
});
ipcMain.handle('piktoor:clipboardRead', async () => {
  const formats = clipboard.availableFormats();
  let token = null, dataUrl = null;
  try {
    const b = clipboard.readBuffer(CUSTOM_CLIPBOARD);
    if (b && b.length) token = b.toString('utf8');
  } catch {}
  try {
    const image = clipboard.readImage();
    if (image && !image.isEmpty()) dataUrl = image.toDataURL();
  } catch {}
  return { token, dataUrl, formats };
});

"""
          s=s[:start]+clip+s[end:]
          s=s.replace("app.whenReady().then(createWindow);\napp.on('window-all-closed', () => app.quit());",
"""app.on('open-file', (event, file) => {
  event.preventDefault();
  if (file && isSupported(file)) sendOpen(file);
});
app.whenReady().then(createWindow);
app.on('activate', () => {
  if (BrowserWindow.getAllWindows().length === 0) createWindow();
});
app.on('window-all-closed', () => {
  if (process.platform !== 'darwin') app.quit();
});""")
          f.write_text(s)
          ui=Path('payload/resources/app/web/src/main.js')
          ui.write_text(ui.read_text().replace('Windows clipboard','system clipboard'))
          PY
      - name: Download Electron Mac runtimes
        shell: bash
        run: |
          set -euo pipefail
          VER="$(cat payload/version)"
          curl -fL "https://github.com/electron/electron/releases/download/v${VER}/electron-v${VER}-darwin-arm64.zip" -o arm64.zip
          curl -fL "https://github.com/electron/electron/releases/download/v${VER}/electron-v${VER}-darwin-x64.zip" -o x64.zip
          unzip -q arm64.zip -d arm64
          unzip -q x64.zip -d x64
      - name: Prepare architecture apps
        shell: bash
        run: |
          set -euo pipefail
          for ARCH in arm64 x64; do
            mv "$ARCH/Electron.app" "Piktoor-${ARCH}.app"
            mv "Piktoor-${ARCH}.app/Contents/MacOS/Electron" "Piktoor-${ARCH}.app/Contents/MacOS/Piktoor"
            rm -rf "Piktoor-${ARCH}.app/Contents/Resources/default_app.asar"
            mkdir -p "Piktoor-${ARCH}.app/Contents/Resources/app"
            cp -R payload/resources/app/. "Piktoor-${ARCH}.app/Contents/Resources/app/"
            PLIST="Piktoor-${ARCH}.app/Contents/Info.plist"
            /usr/libexec/PlistBuddy -c "Set :CFBundleExecutable Piktoor" "$PLIST"
            /usr/libexec/PlistBuddy -c "Set :CFBundleName Piktoor" "$PLIST"
            /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName Piktoor" "$PLIST"
            /usr/libexec/PlistBuddy -c "Set :CFBundleIdentifier com.safisolutions.piktoor" "$PLIST"
            /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString 1.0.0" "$PLIST"
            /usr/libexec/PlistBuddy -c "Set :CFBundleVersion 1.0.0" "$PLIST"
            chmod +x "Piktoor-${ARCH}.app/Contents/MacOS/Piktoor"
          done
      - name: Merge universal app
        shell: bash
        run: |
          set -euo pipefail
          npm init -y >/dev/null 2>&1
          npm install --silent @electron/universal
          node - <<'NODE'
          const { makeUniversalApp } = require('@electron/universal');
          (async()=>{await makeUniversalApp({
            x64AppPath:'Piktoor-x64.app',
            arm64AppPath:'Piktoor-arm64.app',
            outAppPath:'Piktoor.app',
            force:true
          });})().catch(e=>{console.error(e);process.exit(1)});
          NODE
          echo "Architectures: $(lipo -archs Piktoor.app/Contents/MacOS/Piktoor)"
          codesign --force --deep --sign - Piktoor.app
          codesign --verify --deep --strict Piktoor.app
      - name: Package ZIP and DMG
        shell: bash
        run: |
          set -euo pipefail
          ditto -c -k --sequesterRsrc --keepParent Piktoor.app "Piktoor Mac.zip"
          mkdir dmgroot
          cp -R Piktoor.app dmgroot/
          ln -s /Applications dmgroot/Applications
          hdiutil create -volname Piktoor -srcfolder dmgroot -ov -format UDZO "Piktoor Mac.dmg"
          hdiutil verify "Piktoor Mac.dmg"
          unzip -t "Piktoor Mac.zip" >/dev/null
          shasum -a 256 "Piktoor Mac.zip" "Piktoor Mac.dmg"
      - name: Upload deliverables
        uses: actions/upload-artifact@v4
        with:
          name: Piktoor-Mac-Deliverables
          retention-days: 7
          compression-level: 0
          path: |
            Piktoor.app
            Piktoor Mac.zip
            Piktoor Mac.dmg

# trigger existing workflow
