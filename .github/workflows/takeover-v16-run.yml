name: TAKEOVER V16 Runner
on:
  push:
    branches: [main]
    paths: ['.github/workflows/takeover-v16-run.yml']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply V16
        run: python .takeover-v16-patch.py
      - name: Verify V16
        run: |
          node --check takeover-v3.js
          node --check boot.js
          grep -q 'frameCells' takeover-v3.js
          grep -q 'ensureFrameClip' takeover-v3.js
          grep -q 'startLayerTouch' takeover-v3.js
          grep -q 'PINCH with two fingers' takeover-v3.js
          grep -q 'showHandoffReturnScreen' takeover-v3.js
          grep -q 'takeover-v3.js?v=16' boot.js
          grep -q 'takeover-v3.css?v=16' boot.js
          grep -q 'boot.js?v=12' index.html
          grep -q 'TAKEOVER V16' takeover-v3.css
      - name: Commit V16
        run: |
          git config user.name "TAKEOVER Builder"
          git config user.email "actions@users.noreply.github.com"
          git add takeover-v3.js takeover-v3.css boot.js index.html
          git commit -m "Preserve dead-pixel canvases and improve mobile auth gestures"
          git push
