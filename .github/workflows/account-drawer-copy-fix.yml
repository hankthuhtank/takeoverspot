name: TAKEOVER Account Drawer Copy Fix
on:
  push:
    branches: [main]
    paths: ['.github/workflows/account-drawer-copy-fix.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Clean account drawer section text
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old1='<div class="selector-title"><div><b>OWNED TERRITORY</b><small>Edit each creative separately. Click a spot chip to defend its price.</small></div></div>'
          new1='<div class="selector-title"><div><b>OWNED TERRITORY</b><small style="display:block;margin-top:5px;line-height:1.45">Edit each creative separately. Click a spot chip to defend its price.</small></div></div>'
          old2='<div class="selector-title"><div><b>ALERTS</b><small>Outbids and payment updates.</small></div></div>'
          new2='<div class="selector-title"><div><b>ALERTS</b><small style="display:block;margin-top:5px;line-height:1.45">Outbids and payment updates.</small></div></div>'
          if old1 not in s: raise SystemExit('Owned territory header not found')
          if old2 not in s: raise SystemExit('Alerts header not found')
          s=s.replace(old1,new1,1).replace(old2,new2,1)
          p.write_text(s)
          PY
      - name: Verify
        run: |
          grep -q 'OWNED TERRITORY</b><small style="display:block;margin-top:5px;line-height:1.45"' index.html
          grep -q 'ALERTS</b><small style="display:block;margin-top:5px;line-height:1.45"' index.html
      - name: Commit
        run: |
          git config user.name "TAKEOVER Builder"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Clean My Territory section formatting"
          git push
