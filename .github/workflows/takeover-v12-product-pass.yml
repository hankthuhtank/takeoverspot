name: TAKEOVER V12 Product Pass
on:
  push:
    branches: [main]
    paths: ['.github/workflows/takeover-v12-product-pass.yml']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build V12
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          # ---------- INDEX / ADMIN CONSOLE ----------
          p=Path('index.html'); h=p.read_text()
          old_footer='<a href="terms.html">TERMS</a><a href="privacy.html">PRIVACY</a><a href="auction-rules.html">RULES</a><a href="payments.html">PAYMENTS</a><a href="content-policy.html">AD POLICY</a><a href="copyright.html">COPYRIGHT</a><a href="contact.html">REPORT / CONTACT</a>'
          new_footer=old_footer+'<a href="https://x.com/takeoverspot" target="_blank" rel="noopener">X</a><a href="https://www.instagram.com/takeover.spot" target="_blank" rel="noopener">INSTAGRAM</a>'
          if old_footer in h: h=h.replace(old_footer,new_footer,1)

          admin=r'''<section class="panel admin-console" id="adminPanel">
  <div class="admin-shell">
    <aside class="admin-nav">
      <div class="admin-brand"><div><span>OWNER ONLY</span><b>TAKEOVER<br>CONTROL</b></div><button class="close" data-close>×</button></div>
      <button class="admin-tab active" data-admin-tab="dashboard">DASHBOARD</button>
      <button class="admin-tab" data-admin-tab="board">LIVE BOARD</button>
      <button class="admin-tab" data-admin-tab="purchases">PURCHASES</button>
      <button class="admin-tab" data-admin-tab="accounts">ACCOUNTS</button>
      <button class="admin-tab" data-admin-tab="storage">STORAGE</button>
      <button class="admin-tab" data-admin-tab="security">SECURITY</button>
      <button class="admin-tab" data-admin-tab="settings">SETTINGS</button>
      <button class="admin-tab" data-admin-tab="moderation">MODERATION / AUDIT</button>
      <div class="admin-lock"><b>SERVER-LOCKED</b><span>Every admin request is re-authorized on the backend.</span></div>
    </aside>
    <main class="admin-main">
      <div class="admin-top"><div><span id="adminSectionKicker">OWNER CONSOLE</span><h2 id="adminSectionTitle">Dashboard</h2></div><button class="admin-refresh" id="adminRefresh">REFRESH</button></div>

      <section class="admin-pane active" data-admin-pane="dashboard">
        <div class="admin-metrics" id="adminOverview"><div class="empty">Loading owner dashboard…</div></div>
        <div class="admin-block"><div class="admin-block-head"><div><b>RECENT OWNER ACTIVITY</b><span>Maintenance and administrative actions.</span></div></div><div id="adminEvents"><div class="empty">No owner activity yet.</div></div></div>
      </section>

      <section class="admin-pane" data-admin-pane="board">
        <div class="admin-block"><div class="admin-block-head"><div><b>LIVE BOARD</b><span>All 16 spots. Emergency reset only.</span></div></div><div id="adminBoard"></div></div>
      </section>

      <section class="admin-pane" data-admin-pane="purchases">
        <div class="admin-block"><div class="admin-block-head"><div><b>RECENT PURCHASES</b><span>Payment state, completed takeovers and refunds.</span></div></div><div id="adminAttempts"></div></div>
      </section>

      <section class="admin-pane" data-admin-pane="accounts">
        <div class="admin-block"><div class="admin-block-head admin-search-head"><div><b>ACCOUNTS</b><span>Search customers and see ownership/purchase history.</span></div><input id="adminAccountSearch" type="search" placeholder="Search email or company"></div><div id="adminAccounts"><div class="empty">Loading accounts…</div></div></div>
      </section>

      <section class="admin-pane" data-admin-pane="storage">
        <div class="admin-block"><div class="admin-block-head"><div><b>CREATIVE STORAGE</b><span>Current ads and recent purchases stay protected. Old unreferenced assets are eligible for cleanup.</span></div><div class="admin-actions"><button class="tiny" id="adminScanStorage">SCAN</button><button class="tiny danger" id="adminCleanStorage">CLEAN ORPHANS</button></div></div><div id="adminStorage"><div class="empty">Loading storage…</div></div></div>
      </section>

      <section class="admin-pane" data-admin-pane="security">
        <div class="admin-block"><div class="admin-block-head"><div><b>SECURITY / SYSTEM HEALTH</b><span>Live owner-only checks. Admin controls are enforced server-side, not by the hidden button.</span></div></div><div id="adminHealth"><div class="empty">Checking…</div></div><div id="adminSecurity"></div></div>
      </section>

      <section class="admin-pane" data-admin-pane="settings">
        <div class="admin-block"><div class="admin-block-head"><div><b>BOARD SETTINGS</b><span>Operational controls that change the live site.</span></div></div>
          <label class="toggle"><input id="purchasesEnabled" type="checkbox"> Purchases enabled</label>
          <div class="admin-config"><div class="field"><label>EMPTY SPOT START</label><input id="startingPrice" type="number" min="1" step="1"></div><div class="field"><label>MIN TAKEOVER INCREASE</label><input id="minIncrement" type="number" min="1" step="1"></div><div class="field"><label>ORPHAN ASSET RETENTION · DAYS</label><input id="storageRetentionDays" type="number" min="7" max="365" step="1" value="30"></div></div>
          <button class="secondary" id="saveConfig">SAVE SETTINGS</button>
        </div>
      </section>

      <section class="admin-pane" data-admin-pane="moderation">
        <div class="admin-block"><div class="admin-block-head"><div><b>MODERATION HISTORY</b><span>Private owner log. Ordinary bad taste is not a reset reason.</span></div></div><div id="adminModeration"></div></div>
      </section>
    </main>
  </div>
</section>'''
          pattern=r'<aside class="panel drawer" id="adminPanel">.*?</aside>\n\n<section class="panel modal moderation-modal" id="moderationModal">'
          m=re.search(pattern,h,re.S)
          if not m: raise SystemExit('admin panel marker missing')
          h=re.sub(pattern,admin+'\n\n<section class="panel modal moderation-modal" id="moderationModal">',h,count=1,flags=re.S)
          h=h.replace('boot.js?v=7','boot.js?v=8')
          p.write_text(h)

          # ---------- MAIN JS ----------
          p=Path('takeover-v3.js'); s=p.read_text()
          s=s.replace("config={starting_price:10,min_increment:1,purchases_enabled:true,page_shield_until:null}","config={starting_price:10,min_increment:1,purchases_enabled:true,page_shield_until:null,storage_retention_days:30}",1)
          s=s.replace(".select('starting_price,min_increment,purchases_enabled,page_shield_until')",".select('starting_price,min_increment,purchases_enabled,page_shield_until,storage_retention_days')")

          # predictable geometry: no silent remapping of layers
          shape=r'''function shapeLayerGeom(l,cells,display='combined'){return{x:Number(l.x)||0,y:Number(l.y)||0,w:Number(l.w)||40,h:Number(l.h)||20,size:Number(l.size)||18}}'''
          s,n=re.subn(r"function shapeLayerGeom\(.*?\nfunction buildCanvasCreative",shape+'\nfunction buildCanvasCreative',s,count=1,flags=re.S)
          if n!=1: raise SystemExit('shapeLayerGeom replacement failed')

          # preserve richer layer properties
          old="fit:l.fit==='cover'?'cover':'contain'}"
          new="fit:l.fit==='cover'?'cover':'contain',motion:['none','float','pulse','drift','glow','tilt','marquee'].includes(l.motion)?l.motion:'none',rotation:clamp(l.rotation||0,-180,180),opacity:clamp(l.opacity==null?1:l.opacity,.15,1),radius:clamp(l.radius||0,0,50),z:clamp(l.z||1,0,30)}"
          if old not in s: raise SystemExit('normalize layer marker missing')
          s=s.replace("type:['text','image','button'].includes(l.type)?l.type:'text'","type:['text','image','button','shape'].includes(l.type)?l.type:'text'",1).replace(old,new,1)

          creative=r'''function buildCanvasCreative(s,creativeId,cells=null,interactive=true){const c=normalizeCanvas(s.canvas_json,s.company_name,s.logo_url),a=document.createElement('a');a.className='canvas-creative';if(interactive){a.href=s.website||'#';a.target='_blank';a.rel='noopener sponsored'}else{a.removeAttribute('href');a.removeAttribute('target');a.setAttribute('aria-hidden','true');a.tabIndex=-1}a.dataset.creativeId=creativeId||'';a.style.background=canvasBgStyle(c);c.layers.slice().sort((x,y)=>Number(x.z||1)-Number(y.z||1)).forEach(l=>{const g=shapeLayerGeom(l,cells,c.display),d=document.createElement('div');d.className=`canvas-layer ${layerFont(l)} ${l.type==='button'?'is-button':''} ${l.type==='shape'?'is-shape':''} motion-${l.motion||'none'}`;d.style.left=`${g.x}%`;d.style.top=`${g.y}%`;d.style.width=`${g.w}%`;d.style.height=`${g.h}%`;d.style.color=l.color;d.style.textAlign=l.align;d.style.opacity=String(l.opacity==null?1:l.opacity);d.style.zIndex=String(l.z||1);d.style.setProperty('--rot',`${Number(l.rotation||0)}deg`);d.style.setProperty('--layer-size',`${Math.max(2,g.size/4)}cqw`);if(l.type==='shape'){d.style.background=l.bg||'#111111';d.style.borderRadius=`${Number(l.radius||0)}%`}else if(l.type==='button'){d.textContent=l.text||'LEARN MORE';d.style.background=l.bg||'#111111'}else if(l.type==='image'&&safeImg(l.src)){d.dataset.fit=l.fit||'contain';const img=document.createElement('img');img.src=safeImg(l.src);img.alt=l.role==='logo'?(s.company_name||'Advertiser'):'';d.appendChild(img)}else{d.textContent=l.text||''}a.appendChild(d)});const site=document.createElement('span');site.className='canvas-site';site.textContent=host(s.website);a.appendChild(site);if(interactive)a.addEventListener('click',()=>{if(creativeId)sb.rpc('record_takeover_click',{p_creative_id:creativeId}).catch(()=>{})});return a}'''
          s,n=re.subn(r"function buildCanvasCreative\(.*?\n\nfunction partitionRectangles",creative+'\n\nfunction partitionRectangles',s,count=1,flags=re.S)
          if n!=1: raise SystemExit('creative renderer replacement failed')

          # Logo preview: image fills card, replace action overlays top-right
          logo=r'''function setLogoPreview(boxSelector,inputSelector,url,placeholder){const box=$(boxSelector),input=$(inputSelector);if(!box||!input)return;box.onclick=null;[...box.children].forEach(el=>{if(el!==input)el.remove()});const trigger=document.createElement('label');trigger.className='logo-trigger';trigger.htmlFor=input.id;const src=safeImg(url);if(src){const img=document.createElement('img');img.src=src;img.alt='Logo preview';trigger.appendChild(img)}else{const empty=document.createElement('span');empty.className='logo-empty';empty.textContent=placeholder||'CLICK TO CHOOSE LOGO';trigger.appendChild(empty)}const choose=document.createElement('span');choose.className='logo-choose';choose.textContent=src?'REPLACE LOGO':'CHOOSE LOGO';trigger.appendChild(choose);box.insertBefore(trigger,input)}'''
          s,n=re.subn(r"function setLogoPreview\(.*?\nfunction openTakeover",logo+'\nfunction openTakeover',s,count=1,flags=re.S)
          if n!=1: raise SystemExit('logo preview replacement failed')

          # richer presets + shape helper
          s=s.replace("['clean','CLEAN'],['ink','INK'],['signal','SIGNAL'],['editorial','EDITORIAL'],['luxury','LUXURY'],['blueprint','BLUEPRINT'],['pop','POP'],['terminal','TERMINAL'],['poster','POSTER'],['photo','PHOTO HERO'],['stamp','STAMP'],['split','SPLIT']","['clean','CLEAN'],['ink','INK'],['signal','SIGNAL'],['editorial','EDITORIAL'],['luxury','LUXURY'],['blueprint','BLUEPRINT'],['pop','POP'],['terminal','TERMINAL'],['poster','POSTER'],['photo','PHOTO HERO'],['stamp','STAMP'],['split','SPLIT'],['neon','NEON'],['orbit','ORBIT'],['glass','GLASS'],['racing','RACING'],['ticker','TICKER'],['aurora','AURORA']",1)
          marker="function presetButton(text,x,y,w,h,color,bg){return{id:uid(),type:'button',text,x,y,w,h,font:'clean',size:12,color,bg,align:'center'}}"
          if marker not in s: raise SystemExit('preset helper marker missing')
          s=s.replace(marker,marker+"\nfunction presetShape(x,y,w,h,bg,radius=0,opacity=1,rotation=0,motion='none'){return{id:uid(),type:'shape',x,y,w,h,bg,radius,opacity,rotation,motion,z:0}}",1)
          default_marker="default:c.bg={type:'solid',color:'#ffffff'};c.layers=[logo,presetText(brand,10,32,80,24,'heavy',28,'#111111'),presetText(site,12,66,76,9,'mono',9,'#777777'),presetButton('VISIT',34,80,32,10,'#ffffff','#111111')];}"
          if default_marker not in s: raise SystemExit('preset default marker missing')
          extra="""case'neon':c.bg={type:'gradient',color:'#060612',color2:'#171742',angle:135};c.layers=[presetShape(5,8,28,28,'#6d5cff',50,.4,0,'drift'),presetShape(70,58,24,24,'#00e6b8',50,.35,0,'float'),Object.assign(presetText(brand,8,30,84,28,'tech',27,'#ffffff'),{motion:'glow',z:3}),Object.assign(presetButton('ENTER',33,72,34,12,'#05050b','#00e6b8'),{motion:'pulse',z:3}),logo&&Object.assign(logo,{motion:'float',z:3})];break;
case'orbit':c.bg={type:'solid',color:'#f4f2e9'};c.layers=[presetShape(-6,10,38,38,'#ff5f40',50,.9,0,'drift'),presetShape(72,58,34,34,'#111111',50,.95,0,'float'),Object.assign(presetText(brand,13,33,74,25,'modern',28,'#111111'),{z:4}),Object.assign(presetText('OWN THE SPACE',18,63,64,9,'mono',10,'#555555'),{motion:'float',z:4}),logo&&Object.assign(logo,{z:4})];break;
case'glass':c.bg={type:'gradient',color:'#5b6cff',color2:'#ff6eb4',angle:130};c.layers=[presetShape(10,17,80,66,'#ffffff',8,.24,-3,'float'),Object.assign(presetText(brand,14,35,72,24,'modern',27,'#ffffff'),{z:4}),Object.assign(presetButton('SEE MORE',34,70,32,11,'#111111','#ffffff'),{z:4}),logo&&Object.assign(logo,{z:4})];break;
case'racing':c.bg={type:'solid',color:'#f7f4ed'};c.layers=[presetShape(-10,12,120,18,'#ff4c22',0,1,-5,'none'),presetShape(-10,70,120,9,'#111111',0,1,-5,'none'),Object.assign(presetText(brand,7,34,86,27,'condensed',34,'#111111','left'),{z:4}),Object.assign(presetText('MOVE FAST → '+site,7,63,86,9,'mono',9,'#111111','left'),{motion:'marquee',z:4}),logo&&Object.assign(logo,{z:4})];break;
case'ticker':c.bg={type:'solid',color:'#111111'};c.layers=[presetShape(0,0,100,13,'#ffe600',0,1),Object.assign(presetText('TAKEOVER • '+brand+' • '+site+' • ',0,3,100,8,'mono',9,'#111111','left'),{motion:'marquee',z:4}),Object.assign(presetText(brand,8,33,84,29,'heavy',31,'#ffffff'),{motion:'float',z:3}),presetButton('OPEN',36,76,28,11,'#111111','#ffe600'),logo&&Object.assign(logo,{z:4})];break;
case'aurora':c.bg={type:'gradient',color:'#071c24',color2:'#274b5b',angle:135};c.layers=[presetShape(4,4,48,48,'#5affd8',50,.25,0,'drift'),presetShape(58,48,46,46,'#7c6cff',50,.3,0,'float'),Object.assign(presetText(brand,8,31,84,28,'modern',29,'#ffffff'),{motion:'glow',z:4}),Object.assign(presetText(site,15,68,70,9,'mono',9,'#c8fff0'),{z:4}),logo&&Object.assign(logo,{motion:'float',z:4})];break;
"""+default_marker
          s=s.replace(default_marker,extra,1)

          # toolbar: shape + clearer helper text
          s=s.replace('<button class="tool-btn" id="addButton">+ BUTTON</button><label class="tool-btn canvas-image-upload">+ IMAGE', '<button class="tool-btn" id="addButton">+ BUTTON</button><button class="tool-btn" id="addShape">+ SHAPE</button><label class="tool-btn canvas-image-upload">+ IMAGE',1)
          s=s.replace('CLICK an item to style it · DRAG to move · GRAB THE CORNER to resize · DOUBLE-CLICK text to edit','DRAG anything · RESIZE from the corner · DOUBLE-CLICK text · use POSITION for exact control',1)
          add_btn="$('#addButton').onclick=()=>addEditorLayer({type:'button',text:'LEARN MORE',x:30,y:68,w:40,h:12,font:'clean',size:12,color:'#ffffff',bg:'#111111',align:'center'});"
          if add_btn not in s: raise SystemExit('add button marker missing')
          s=s.replace(add_btn,add_btn+"$('#addShape').onclick=()=>addEditorLayer({type:'shape',x:25,y:25,w:50,h:50,bg:'#111111',radius:8,opacity:1,z:0});",1)

          # editor renderer + direct DOM syncing
          editor=r'''function applyEditorLayerStyle(d,l){d.className=`editor-layer ${layerFont(l)} ${l.type==='button'?'is-button':''} ${l.type==='shape'?'is-shape':''} ${editorSelected===l.id?'selected':''} ${l.fit==='cover'?'cover':''} motion-${l.motion||'none'}`;d.style.left=`${l.x}%`;d.style.top=`${l.y}%`;d.style.width=`${l.w}%`;d.style.height=`${l.h}%`;d.style.color=l.color||'#111';d.style.textAlign=l.align||'center';d.style.fontSize=`${clamp(l.size||18,8,200)}px`;d.style.opacity=String(l.opacity==null?1:l.opacity);d.style.zIndex=String(l.z||1);d.style.setProperty('--rot',`${Number(l.rotation||0)}deg`);if(l.type==='button'||l.type==='shape')d.style.background=l.bg||'#111';if(l.type==='shape')d.style.borderRadius=`${Number(l.radius||0)}%`}
function renderEditor(){const stage=$('#canvasStage');if(!stage||!editorCanvas)return;stage.querySelectorAll('.editor-layer').forEach(x=>x.remove());stage.style.background=canvasBgStyle(editorCanvas);editorCanvas.layers.slice().sort((x,y)=>Number(x.z||1)-Number(y.z||1)).forEach(l=>{const d=document.createElement('div');d.dataset.layer=l.id;applyEditorLayerStyle(d,l);if(l.type==='button'){const content=document.createElement('span');content.className='editor-content';content.textContent=l.text||'LEARN MORE';d.appendChild(content)}else if(l.type==='image'&&safeImg(l.src)){const img=document.createElement('img');img.src=safeImg(l.src);d.appendChild(img)}else if(l.type!=='shape'){const content=document.createElement('span');content.className='editor-content';content.textContent=l.text||'';d.appendChild(content)}const handle=document.createElement('i');handle.className='resize-handle';d.appendChild(handle);d.onpointerdown=e=>startLayerDrag(e,l.id);handle.onpointerdown=e=>{e.stopPropagation();startLayerResize(e,l.id)};d.onclick=e=>{e.preventDefault();editorSelected=l.id;renderEditor()};if(!['image','shape'].includes(l.type))d.ondblclick=e=>{e.preventDefault();e.stopPropagation();editorSelected=l.id;renderInspector();setTimeout(()=>{$('#layerText')?.focus();$('#layerText')?.select()},0)};stage.appendChild(d)});renderInspector()}
function syncEditorLayer(l){const d=$(`.editor-layer[data-layer="${l.id}"]`);if(!d)return;applyEditorLayerStyle(d,l);const content=d.querySelector('.editor-content');if(content)content.textContent=l.text||''}'''
          s,n=re.subn(r"function renderEditor\(\).*?\nfunction stageDelta",editor+'\nfunction stageDelta',s,count=1,flags=re.S)
          if n!=1: raise SystemExit('editor renderer replacement failed')

          inspector=r'''function renderInspector(){const box=$('#layerInspector'),l=editorCanvas?.layers.find(x=>x.id===editorSelected);if(!box)return;if(!l){box.innerHTML='<h3>SELECT SOMETHING</h3><p class="canvas-help">Click anything on the canvas. Nothing is auto-moved behind your back.</p>';return}const isText=!['image','shape'].includes(l.type);box.innerHTML=`<h3>EDIT ${l.type.toUpperCase()}</h3>${isText?`<div class="canvas-row"><label>TEXT</label><input id="layerText" type="text" maxlength="140" value="${esc(l.text||'')}"></div><div class="canvas-row"><label>FONT</label><select id="layerFont"><option value="clean">Clean · Manrope</option><option value="heavy">Heavy · Manrope</option><option value="modern">Modern · Space Grotesk</option><option value="condensed">Condensed · Oswald</option><option value="display">Display · Bebas Neue</option><option value="editorial">Editorial · Playfair</option><option value="serif">Classic Serif · Baskerville</option><option value="mono">Mono · DM Mono</option><option value="tech">Tech · Orbitron</option><option value="script">Script · Pacifico</option></select></div><div class="canvas-row"><label>SIZE</label><input id="layerSize" type="range" min="8" max="200" value="${l.size||18}"><output id="layerSizeValue" class="size-readout">${l.size||18}px</output></div><div class="canvas-row"><label>COLOR</label><input id="layerColor" type="color" value="${safeColor(l.color,'#111111')}"></div>`:''}${l.type==='image'?`<div class="canvas-row"><label>FIT</label><select id="layerFit"><option value="contain">Contain</option><option value="cover">Fill</option></select></div>`:''}${['button','shape'].includes(l.type)?`<div class="canvas-row"><label>FILL</label><input id="layerBg" type="color" value="${safeColor(l.bg,'#111111')}"></div>`:''}${l.type==='shape'?`<div class="canvas-row"><label>ROUND</label><input id="layerRadius" type="range" min="0" max="50" value="${l.radius||0}"></div>`:''}<div class="canvas-row"><label>MOTION</label><select id="layerMotion"><option value="none">None</option><option value="float">Float</option><option value="pulse">Pulse</option><option value="drift">Drift</option><option value="glow">Glow</option><option value="tilt">Tilt</option><option value="marquee">Slide</option></select></div><div class="canvas-row"><label>ROTATE</label><input id="layerRotation" type="range" min="-180" max="180" value="${l.rotation||0}"></div><div class="canvas-row"><label>OPACITY</label><input id="layerOpacity" type="range" min="15" max="100" value="${Math.round((l.opacity==null?1:l.opacity)*100)}"></div><h3 class="inspector-sub">POSITION / SIZE</h3><div class="geometry-grid"><label>X<input id="layerX" type="number" min="0" max="100" step="1" value="${Math.round(l.x)}"></label><label>Y<input id="layerY" type="number" min="0" max="100" step="1" value="${Math.round(l.y)}"></label><label>W<input id="layerW" type="number" min="5" max="100" step="1" value="${Math.round(l.w)}"></label><label>H<input id="layerH" type="number" min="5" max="100" step="1" value="${Math.round(l.h)}"></label></div><div class="inspector-actions"><button class="tool-btn" id="centerLayer">CENTER</button><button class="tool-btn" id="fullLayer">FULL WIDTH</button><button class="tool-btn" id="duplicateLayer">DUPLICATE</button><button class="tool-btn" id="frontLayer">FRONT</button><button class="tool-btn" id="backLayer">BACK</button></div><button class="canvas-delete" id="deleteLayer">DELETE ${l.type.toUpperCase()}</button>`;
