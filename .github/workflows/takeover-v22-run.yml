name: TAKEOVER V22 Apply
'on':
  push:
    branches: [main]
    paths:
      - '.takeover-v22-patch.py'
      - '.takeover-v22-fix.py'
      - '.github/workflows/takeover-v22-run.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Pin Supabase browser client
        run: |
          mkdir -p vendor
          curl -fsSL https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.4/dist/umd/supabase.min.js -o vendor/supabase-2.112.4.min.js
          test -s vendor/supabase-2.112.4.min.js
      - name: Apply V22 patch
        run: |
          python .takeover-v22-patch.py
          python .takeover-v22-fix.py
      - name: Verify syntax and contracts
        run: |
          node --check takeover-v3.js
          node --check boot.js
          grep -q 'refundTerritoryAction' index.html
          grep -q 'takeover-v3.js?v=22' boot.js
          grep -q 'TAKEOVER V22 DESKTOP READABILITY' takeover-v3.css
          test ! -e launch.js
          test ! -e takeover-v2.js
      - name: Commit V22
        run: |
          git config user.name 'takeover-bot'
          git config user.email 'takeover-bot@users.noreply.github.com'
          git restore .github/workflows/ci-v18.yml
          git add -A
          git commit -m 'TAKEOVER V22 security hardening and desktop readability'
          git push
