name: TAKEOVER V17 Runner
'on':
  push:
    branches: [main]
    paths: ['.github/workflows/takeover-v17-run.yml']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply V17
        run: python .takeover-v17-patch.py
      - name: Verify V17
        run: |
          node --check takeover-v3.js
          node --check boot.js
          grep -q "takeover-v3.js?v=17" boot.js
          grep -q "takeover-v3.css?v=17" boot.js
          grep -q "raw=await f.arrayBuffer" takeover-v3.js
          grep -q "const f=\$('#logoFile')?.files?.\[0\]" takeover-v3.js
          grep -q "case'glitch'" takeover-v3.js
          grep -q "case'chaos'" takeover-v3.js
          grep -q "case'hyper'" takeover-v3.js
          grep -q "case'confetti'" takeover-v3.js
          grep -q "motion-bounce" takeover-v3.css
          grep -q "canvas-work{display:contents" takeover-v3.css
          grep -q "position:sticky!important" takeover-v3.css
      - name: Commit V17
        run: |
          git config user.name "hankthuhtank"
          git config user.email "safihelal@gmail.com"
          git add takeover-v3.js takeover-v3.css boot.js index.html
          git commit -m "TAKEOVER V17 mobile editor and checkout hardening"
          git push
