name: TAKEOVER Polish Upgrade
on:
  push:
    branches: [main]
    paths:
      - 'scripts/polish_upgrade.py'
      - '.github/workflows/polish-upgrade.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build patched frontend
        run: python scripts/polish_upgrade.py
      - name: Validate JavaScript syntax
        run: node --check takeover-v2.js
      - name: Validate key UI hooks
        run: |
          python - <<'PY'
          from pathlib import Path
          html=Path('index.html').read_text()
          js=Path('takeover-v2.js').read_text()
          css=Path('takeover.css').read_text()
          checks=[
            ('moderation modal','id="moderationModal"' in html),
            ('social snapshot label','4-HOUR SOCIAL SNAPSHOTS' in html),
            ('reveal stage','id="takeoverRevealStage"' in html),
            ('admin reset rpc',"admin_reset_takeover_spot" in js),
            ('reveal animation','playTakeoverReveal' in js and 'dryEraseSweep' in css),
            ('larger modal','width:min(860px' in css),
          ]
          bad=[name for name,ok in checks if not ok]
          if bad: raise SystemExit('Missing: '+', '.join(bad))
          print('PASS:', ', '.join(name for name,_ in checks))
          PY
      - name: Package tested frontend
        uses: actions/upload-artifact@v4
        with:
          name: takeover-polish-tested
          path: |
            index.html
            takeover-v2.js
            takeover.css
          retention-days: 1
