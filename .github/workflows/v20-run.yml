name: TAKEOVER V20 Runner
'on':
  push:
    branches:
      - main
    paths:
      - .github/workflows/v20-run.yml
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Extract patch
        run: python -c "from pathlib import Path; import textwrap; s=Path('.github/workflows/v20-design-library.yml').read_text(); a=s.index(\"python - <<'PY'\")+len(\"python - <<'PY'\"); b=s.index('\\n          PY',a); Path('/tmp/v20.py').write_text(textwrap.dedent(s[a:b]).lstrip())"
      - name: Diagnose patch
        run: |
          set +e
          python /tmp/v20.py > v20-debug.txt 2>&1
          echo "exit=$?" >> v20-debug.txt
          set -e
      - name: Commit diagnostic
        run: |
          git config user.name 'TAKEOVER Build'
          git config user.email 'actions@users.noreply.github.com'
          git add v20-debug.txt
          git commit -m 'Record V20 patch diagnostic'
          git push
