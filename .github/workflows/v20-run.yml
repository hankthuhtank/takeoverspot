name: TAKEOVER V20 Runner
'on':
  push:
    branches:
      - main
    paths:
      - .github/workflows/v20-run.yml
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Extract patch
        run: python -c "from pathlib import Path; import textwrap; s=Path('.github/workflows/v20-design-library.yml').read_text(); a=s.index(\"python - <<'PY'\")+len(\"python - <<'PY'\"); b=s.index('\\n          PY',a); Path('/tmp/v20.py').write_text(textwrap.dedent(s[a:b]).lstrip())"
      - name: Apply patch
        run: python /tmp/v20.py
      - name: Verify
        run: |
          node --check takeover-v3.js
          node --check boot.js
          grep -q 'SAVE TO MY LIBRARY' takeover-v3.js
          grep -q 'REMOVE LOGO' takeover-v3.js
          grep -q 'takeover_saved_designs' takeover-v3.js
          grep -q 'anonymous to visitors' takeover-v3.js
          grep -q "case'dreamscape'" takeover-v3.js
          grep -q "case'stickerbomb'" takeover-v3.js
          grep -q "case'laser'" takeover-v3.js
          grep -q "case'cutpaper'" takeover-v3.js
          grep -q "case'afterdark'" takeover-v3.js
          grep -q 'takeover-v3.js?v=20' boot.js
          grep -q 'takeover-v3.css?v=20' boot.js
          grep -q 'boot.js?v=16' index.html
      - name: Commit
        run: |
          git config user.name 'TAKEOVER Build'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html takeover-v3.js takeover-v3.css boot.js privacy.html
          git commit -m 'Add private design library and creative reuse'
          git push
