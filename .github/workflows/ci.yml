name: TAKEOVER Frontend Smoke Test
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'takeover-v2.js'
      - 'takeover.css'
      - 'boot.js'
      - 'polish.js'
      - 'polish.css'
      - '.github/workflows/ci.yml'
  pull_request:
    paths:
      - 'index.html'
      - 'takeover-v2.js'
      - 'takeover.css'
      - 'boot.js'
      - 'polish.js'
      - 'polish.css'
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install jsdom@25 --no-save
      - name: Syntax check
        run: |
          node --check takeover-v2.js
          node --check polish.js
          node --check boot.js
      - name: Verify polish hooks
        run: |
          grep -q '4-HOUR SOCIAL SNAPSHOTS' index.html
          grep -q 'id="moderationModal"' index.html
          grep -q 'boot.js?v=1' index.html
          grep -q 'admin_reset_takeover_spot' polish.js
          grep -q 'takeover_moderation_log' polish.js
          grep -q 'takeover-reveal-stage' polish.css
          grep -q 'dryEraseSweep' polish.css
          grep -q 'width:min(860px' polish.css
          echo 'PASS: social label, moderation reset, legibility layer, and dry-erase hooks are present.'
      - name: Verify spot and multi-spot flows
        run: |
          cat > smoke.cjs <<'JS'
          const fs=require('fs');
          const {JSDOM}=require('jsdom');
          let html=fs.readFileSync('index.html','utf8').replace(/<script[^>]*src=[^>]*><\/script>/g,'');
          const dom=new JSDOM(html,{url:'https://takeoverspot.com/',runScripts:'outside-only',pretendToBeVisual:true});
          const w=dom.window;
          const board=Array.from({length:12},(_,i)=>({spot_number:i+1,current_price:0,owner_key:null,company_name:null,website:null,logo_url:null,description:null,offer_text:null,feature_image_url:null,layout_mode:'combined',owner_since:null,updated_at:null}));
          const cfg={starting_price:10,min_increment:1,purchases_enabled:true,page_shield_until:null};
          function builder(table){const b={select(){return b},eq(){return b},is(){return b},in(){return Promise.resolve({data:[],error:null})},update(){return b},insert(){return Promise.resolve({data:null,error:null})},limit(){return Promise.resolve({data:[],error:null})},order(){return Promise.resolve({data:table==='takeover_spots'?board:[],error:null})},maybeSingle(){return Promise.resolve({data:table==='takeover_config'?cfg:null,error:null})}};return b}
          const sb={auth:{getSession:()=>Promise.resolve({data:{session:null}}),onAuthStateChange:()=>({data:{subscription:{unsubscribe(){}}}}),signOut:()=>Promise.resolve(),signInWithOtp:()=>Promise.resolve({error:null})},from:builder,rpc:()=>Promise.resolve({data:false,error:null}),channel:()=>({on(){return this},subscribe(){return this}}),removeChannel(){},storage:{from:()=>({upload:()=>Promise.resolve({error:null}),getPublicUrl:()=>({data:{publicUrl:'https://example.test/img.png'}})})},functions:{invoke:()=>Promise.resolve({data:{url:'https://stripe.test'},error:null})}};
          w.supabase={createClient:()=>sb};
          w.eval(fs.readFileSync('takeover-v2.js','utf8'));
          setTimeout(()=>{
            w.document.querySelector('#introGotIt')?.click();
            const cells=[...w.document.querySelectorAll('.available-cell')];
            if(cells.length!==12)throw new Error(`Expected 12 clickable spots, got ${cells.length}`);
            for(let i=0;i<cells.length;i++){
              cells[i].click();
              const modal=w.document.querySelector('#takeoverModal');
              if(!modal.classList.contains('on'))throw new Error(`Spot ${i+1} did not open takeover modal`);
              if(!w.document.querySelector('#logoFile'))throw new Error(`Spot ${i+1} destroyed logo input`);
              w.document.querySelector('#scrim').click();
            }
            cells[0].click();
            if(!w.document.querySelector('#purchaseCreativeUpgrade').hidden)throw new Error('Single spot should not show multi-spot controls');
            [...w.document.querySelectorAll('.mini-spot')][1].click();
            if(w.document.querySelector('#purchaseCreativeUpgrade').hidden)throw new Error('Two spots did not unlock display controls');
            if(w.document.querySelector('#purchaseRichFields').hidden)throw new Error('Combined two spots did not unlock rich fields');
            w.document.querySelector('[data-purchase-layout="divided"]').click();
            if(!w.document.querySelector('#purchaseRichFields').hidden)throw new Error('Divided mode should hide rich fields');
            w.document.querySelector('[data-purchase-layout="combined"]').click();
            if(w.document.querySelector('#purchaseRichFields').hidden)throw new Error('Combined mode should restore rich fields');
            if(!w.document.querySelector('#featureFile'))throw new Error('Feature image input missing');
            w.document.querySelector('#scrim').click();
            w.document.querySelector('#takePageBtn').click();
            if(!w.document.querySelector('#takeoverModal').classList.contains('on'))throw new Error('TAKE THE PAGE did not open takeover modal');
            if(w.document.querySelector('#purchaseCreativeUpgrade').hidden)throw new Error('Full-page flow did not expose multi-spot controls');
            if(!w.document.querySelector('#moderationModal'))throw new Error('Moderation modal missing');
            console.log('PASS: all spots, multi-spot modes, rich fields, full-page flow, and moderation markup are working.');
            process.exit(0);
          },220);
          JS
          node smoke.cjs