name: TAKEOVER Frontend Smoke Test
on:
  push:
    branches: [main]
    paths: ['index.html','takeover-v3.js','takeover-v3.css','takeover.css','boot.js','.github/workflows/ci.yml']
  pull_request:
    paths: ['index.html','takeover-v3.js','takeover-v3.css','takeover.css','boot.js']
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm install jsdom@25 --no-save
      - name: Syntax and V13 architecture
        run: |
          node --check takeover-v3.js
          node --check boot.js
          grep -q 'const TOTAL=16' takeover-v3.js
          grep -q 'takeover-v3.js?v=13' boot.js
          grep -q 'takeover-v3.css?v=13' boot.js
          grep -q 'Promise.resolve(rawRpc' boot.js
          grep -q 'prepareImageFile' takeover-v3.js
          grep -q 'IMAGE_INPUT_LIMIT=25' takeover-v3.js
          grep -q "return{x:Number(l.x)" takeover-v3.js
          grep -q "x:clamp(l.x,-25,125)" takeover-v3.js
          grep -q 'id=\"layerX\" type=\"number\" min=\"-25\" max=\"125\"' takeover-v3.js
          grep -q 'id=\"addShape\"' takeover-v3.js
          grep -q 'presetShape' takeover-v3.js
          grep -q "case'neon'" takeover-v3.js
          grep -q "case'aurora'" takeover-v3.js
          grep -q 'motion-float' takeover-v3.css
          grep -q 'prefers-reduced-motion' takeover-v3.css
          grep -q 'TAKEOVER V12' takeover-v3.css
          grep -q 'takeover-admin-console' takeover-v3.js
          grep -q 'data-admin-tab="accounts"' index.html
          grep -q 'data-admin-tab="storage"' index.html
          grep -q 'data-admin-tab="security"' index.html
          grep -q 'storageRetentionDays' index.html
          grep -q 'id="refundModal"' index.html
          grep -q 'id="adminHealth"' index.html
          grep -q 'selectionComponents' takeover-v3.js
          grep -q 'ensureShapeClip' takeover-v3.js
          grep -q 'purchase-preview-shape' takeover-v3.js
          grep -q 'materializeCanvasAssets' takeover-v3.js
          if grep -q 'Logo is too large (2 MB max)' takeover-v3.js; then exit 1; fi
          if grep -q 'CENTER=' takeover-v3.js; then exit 1; fi
          if grep -q 'isCenterSelection' takeover-v3.js; then exit 1; fi
          if grep -qi 'The Center Four' index.html; then exit 1; fi
          if grep -q 'launch.js' boot.js; then exit 1; fi
          if grep -q 'polish.js' boot.js; then exit 1; fi
      - name: 16-cell board and Canvas V13 flows
        run: |
          cat > v3.cjs <<'JS'
          const fs=require('fs'),{JSDOM}=require('jsdom');
          const html=fs.readFileSync('index.html','utf8').replace(/<script[^>]*src=[^>]*><\/script>/g,'');
          const dom=new JSDOM(html,{url:'https://takeoverspot.com/',runScripts:'outside-only',pretendToBeVisual:true}),w=dom.window;
          if(!w.crypto.randomUUID)w.crypto.randomUUID=()=>Math.random().toString(16).slice(2)+'-0000-4000-8000-000000000000';
          w.confirm=()=>false;
          const board=Array.from({length:16},(_,i)=>({spot_number:i+1,current_price:0,owner_key:null,company_name:null,website:null,logo_url:null,creative_id:null,canvas_json:null,owner_since:null,updated_at:new Date().toISOString()}));
          const cfg={starting_price:10,min_increment:1,purchases_enabled:true,page_shield_until:null,storage_retention_days:30};
          function builder(t){const b={select(){return b},eq(){return b},is(){return b},not(){return b},gte(){return b},in(){return Promise.resolve({data:[],error:null})},update(){return b},insert(){return Promise.resolve({data:null,error:null})},limit(){return Promise.resolve({data:[],error:null})},order(){return Promise.resolve({data:t==='takeover_spots'?board:[],error:null})},maybeSingle(){return Promise.resolve({data:t==='takeover_config'?cfg:null,error:null})},then(r){return Promise.resolve({data:t==='takeover_spots'?board:[],error:null}).then(r)}};return b}
          const rpc=(name)=>Promise.resolve({data:name==='is_takeover_admin'?false:null,error:null});
          const sb={auth:{getSession:()=>Promise.resolve({data:{session:null}}),onAuthStateChange:()=>({data:{subscription:{unsubscribe(){}}}}),signOut:()=>Promise.resolve(),signInWithOtp:()=>Promise.resolve({error:null})},from:builder,rpc,channel:()=>({on(){return this},subscribe(){return this}}),removeChannel(){},storage:{from:()=>({upload:()=>Promise.resolve({error:null}),getPublicUrl:()=>({data:{publicUrl:'https://xvfgiaxxvwdnmzzdfboc.supabase.co/storage/v1/object/public/takeover-creative/test/a.png'}})})},functions:{invoke:()=>Promise.resolve({data:{url:'https://stripe.test'},error:null})}};
          w.supabase={createClient:()=>sb};
          w.localStorage.setItem('takeover_purchase_draft',JSON.stringify({selected:[6],seedSpot:6}));
          w.eval(fs.readFileSync('takeover-v3.js','utf8'));
          setTimeout(()=>{
            w.document.querySelector('#introGotIt')?.click();
            const cells=[...w.document.querySelectorAll('.available-cell')];
            if(cells.length!==16)throw Error('Expected 16 cells, got '+cells.length);
            if(w.localStorage.getItem('takeover_purchase_draft'))throw Error('Legacy draft persisted');
            const page=w.document.querySelector('#takePageBtn');
            if(page.textContent.trim()!=='TAKE THE PAGE · $160')throw Error('Wrong page total: '+page.textContent);
            const social=[...w.document.querySelectorAll('.social-pulse a')].map(a=>a.textContent).join('·');
            if(social!=='X·INSTAGRAM')throw Error('Social labels wrong: '+social);
            if(w.document.querySelectorAll('[data-admin-tab]').length!==8)throw Error('Admin console tabs missing');

            cells[2].click();
            w.document.querySelector('#companyName').value='Example Co';
            w.document.querySelector('#companyWebsite').value='example.com';
            w.document.querySelector('#openPurchaseCanvas').click();
            const stage=w.document.querySelector('#canvasStage'),multi=w.document.querySelector('#multiSpotSection');
            if(!w.document.querySelector('#canvasModal').classList.contains('on'))throw Error('Canvas did not open');
            if(!multi.hidden)throw Error('Single spot should hide multi-spot controls');
            if(stage.style.aspectRatio!=='1 / 1'&&stage.style.aspectRatio!=='1/1')throw Error('Single spot should be square');
            if(w.document.querySelectorAll('#canvasPresets .preset-card').length<18)throw Error('Expanded preset library missing');
            if(!w.document.querySelector('#addShape'))throw Error('Shape tool missing');
            w.document.querySelector('#canvasClose').click();

            const clickMini=n=>[...w.document.querySelectorAll('.mini-spot')][n-1].click();
            clickMini(7);clickMini(11);clickMini(12);
            w.document.querySelector('#openPurchaseCanvas').click();
            if(multi.hidden)throw Error('Multi-spot controls should show');
            if(stage.style.aspectRatio!=='2 / 3'&&stage.style.aspectRatio!=='2/3')throw Error('Combined shape bounds wrong: '+stage.style.aspectRatio);
            if(!stage.style.clipPath.includes('takeover-shape-3-7-11-12'))throw Error('Combined |_ shape clip missing');
            let layer=w.document.querySelector('#canvasStage .editor-layer');
            const directWidth=parseFloat(layer?.style.width||0);
            if(directWidth<70)throw Error('Direct layer geometry was squeezed: '+directWidth);
            const preview=w.document.querySelector('#purchaseCanvasPreview .canvas-creative');
            if(preview?.hasAttribute('href'))throw Error('Purchase preview must not be a live link');
            w.document.querySelector('#displayDivided').click();
            if(stage.style.aspectRatio!=='1 / 1'&&stage.style.aspectRatio!=='1/1')throw Error('Divided should be square');
            if(stage.style.clipPath!=='none')throw Error('Divided should not use combined clipping');
            layer=w.document.querySelector('#canvasStage .editor-layer');
            if(Math.abs(parseFloat(layer.style.width)-directWidth)>.01)throw Error('Divided mutated layer geometry');
            w.document.querySelector('#displayCombined').click();
            if(!stage.style.clipPath.includes('takeover-shape-3-7-11-12'))throw Error('Combined shape did not restore');
            layer=w.document.querySelector('#canvasStage .editor-layer');
            if(Math.abs(parseFloat(layer.style.width)-directWidth)>.01)throw Error('Combined mutated stored geometry');

            w.document.querySelector('#addShape').click();
            if(!w.document.querySelector('#layerMotion'))throw Error('Motion control missing');
            if(w.document.querySelector('#layerX')?.min!=='-25'||w.document.querySelector('#layerW')?.max!=='150')throw Error('Bleed geometry controls missing');
            if(!w.document.querySelector('#duplicateLayer')||!w.document.querySelector('#frontLayer'))throw Error('Layer management controls missing');
            w.document.querySelector('#addText').click();
            const text=w.document.querySelector('#layerText');
            if(!text)throw Error('Text editor missing');
            text.value='HELLO WORLD';text.dispatchEvent(new w.Event('input',{bubbles:true}));
            if(w.document.querySelector('#layerText')!==text)throw Error('Text editor recreated during typing');
            console.log('PASS TAKEOVER CANVAS V13');process.exit(0);
          },500);
          JS
          timeout 14s node v3.cjs
