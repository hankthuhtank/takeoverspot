name: TAKEOVER Final Launch Pass
on:
  push:
    branches: [main]
    paths: ['.github/workflows/final-launch-pass.yml']
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply final patch
        run: python .github/final_launch_patch.py
      - name: Validate runtime
        run: |
          node --check takeover-v3.js
          grep -q "takeover-admin-refund" takeover-v3.js
          grep -q "takeover-launch-health" takeover-v3.js
          grep -q 'id="refundModal"' index.html
          grep -q 'id="adminHealth"' index.html
          grep -q 'SPOT CANVAS' content-policy.html
      - name: Commit final build
        run: |
          git config user.name "TAKEOVER Build"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html takeover-v3.js boot.js contact.html content-policy.html payments.html terms.html privacy.html auction-rules.html
          git commit -m "Finalize TAKEOVER admin refunds and launch readiness"
          git push
