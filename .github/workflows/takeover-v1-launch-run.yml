name: TAKEOVER V1.0 Launch Patch
'on':
  push:
    branches: [main]
    paths: ['.takeover-v1-launch.py','.github/workflows/takeover-v1-launch-run.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply V1.0 launch patch
        run: python .takeover-v1-launch.py
      - name: Verify launch build
        run: |
          node --check takeover-v3.js
          node --check boot.js
          grep -q "APP_VERSION='1.0'" takeover-v3.js
          grep -q 'TAKEOVER V1.0 LAUNCH' takeover-v3.css
          grep -q 'takeover-v3.js?v=1.0' boot.js
          grep -q 'takeover-v3.css?v=1.0' boot.js
          grep -q 'boot.js?v=1.0' index.html
          grep -q 'Cross-device WYSIWYG contract' .github/workflows/ci-v18.yml
      - name: Commit V1.0
        run: |
          git config user.name takeover-bot
          git config user.email takeover-bot@users.noreply.github.com
          git add takeover-v3.js takeover-v3.css boot.js index.html .github/workflows/ci-v18.yml
          git commit -m 'TAKEOVER V1.0 launch: lock cross-device canvas rendering' || exit 0
          git push
