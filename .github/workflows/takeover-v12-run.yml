name: TAKEOVER V12 Runner
'on':
  push:
    branches: [main]
    paths: ['.github/workflows/takeover-v12-run.yml']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Execute V12 patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('.github/workflows/takeover-v12-product-pass.yml').read_text()
          a=s.index('      - name: Build V12')
          a=s.index('        run: |',a)+len('        run: |\n')
          b=s.index('      - name: Verify V12',a)
          lines=[]
          for line in s[a:b].splitlines():
              lines.append(line[10:] if line.startswith('          ') else line)
          Path('/tmp/v12-build.sh').write_text('\n'.join(lines)+'\n')
          PY
          bash /tmp/v12-build.sh
      - name: Verify V12
        run: |
          node --check takeover-v3.js
          node --check boot.js
          grep -q "takeover-admin-console" takeover-v3.js
          grep -q "data-admin-tab=\"storage\"" index.html
          grep -q "storageRetentionDays" index.html
          grep -q "motion-float" takeover-v3.css
          grep -q "presetShape" takeover-v3.js
          grep -q "case'neon'" takeover-v3.js
          grep -q "id=\"addShape\"" takeover-v3.js
          grep -q "return{x:Number(l.x)" takeover-v3.js
          grep -q "takeover-v3.js?v=12" boot.js
          grep -q "takeover-v3.css?v=12" boot.js
          grep -q "boot.js?v=8" index.html
      - name: Commit V12
        run: |
          git config user.name "TAKEOVER Builder"
          git config user.email "actions@users.noreply.github.com"
          git add takeover-v3.js takeover-v3.css index.html boot.js
          git commit -m "Ship mobile-first canvas and owner console V12"
          git push
